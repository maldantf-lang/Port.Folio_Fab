name: Mise à jour des cours

# Rafraîchit prices.json pendant les heures de marché.
# Les horaires cron sont en UTC (Paris = UTC+2 en été).
on:
  schedule:
    # Toutes les 15 min, du lundi au vendredi, de 07h à 21h UTC (09h-23h Paris)
    - cron: "*/15 7-21 * * 1-5"
  workflow_dispatch:        # permet aussi de lancer à la main depuis l'onglet Actions

# Autorise le workflow à écrire dans le dépôt
permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Récupérer les cours
        run: node fetch-prices.js

      - name: Publier prices.json
        run: |
          if git diff --quiet -- prices.json; then
            echo "Aucun changement de cours."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "cours: $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
