// Fetch via Twelve Data — source prioritaire fiable
async function fetchViaTwelveData(tickers){
  const key=getTDKey();
  if(!key) return {};
  const out={};
  // Twelve Data : 1 appel groupé via symbol=A,B,C (plan gratuit accepte le batch)
  try{
    const syms=tickers.map(t=>(TD_MAP[t]&&TD_MAP[t].s)||t);
    const url="https://api.twelvedata.com/price?symbol="+encodeURIComponent(syms.join(","))+"&apikey="+encodeURIComponent(key);
    const c=new AbortController();const to=setTimeout(()=>c.abort(),12000);
    const r=await fetch(url,{signal:c.signal});clearTimeout(to);
    const j=await r.json();
    // Réponse batch : {SYM:{price:"x"}, ...} ou {price:"x"} si 1 seul
    if(j&&j.price&&tickers.length===1){const v=parseFloat(j.price);if(isFinite(v)&&v>0) out[tickers[0]]=v;}
    else{
      for(let i=0;i<tickers.length;i++){
        const tk=tickers[i];const sym=syms[i];
        const entry=j[sym]||j[tk];
        if(entry&&entry.price){const v=parseFloat(entry.price);if(isFinite(v)&&v>0) out[tk]=v;}
      }
    }
    console.log("[TwelveData]",Object.keys(out).length+"/"+tickers.length+" cours");
  }catch(e){console.log("[TwelveData]",e.message);}
  return out;
}

// EUR/USD via Twelve Data
async function fetchEURUSD_TD(){
  const key=getTDKey();if(!key) return null;
  try{
    const c=new AbortController();const to=setTimeout(()=>c.abort(),8000);
    const r=await fetch("https://api.twelvedata.com/price?symbol=EUR/USD&apikey="+encodeURIComponent(key),{signal:c.signal});
    clearTimeout(to);const j=await r.json();
    if(j&&j.price){const eurusd=parseFloat(j.price);
      if(isFinite(eurusd)&&eurusd>0.8&&eurusd<1.6){const usdToEur=1/eurusd;
        console.log("[TwelveData] EUR/USD="+eurusd.toFixed(4)+" → USD→EUR="+usdToEur.toFixed(4));
        return usdToEur;}}
  }catch(e){console.log("[TwelveData EUR/USD]",e.message);}
  return null;
}

// CALCUL DYNAMIQUE AN — Recalibre les fiches analyste à partir de l'historique
// Mix 60% ancrage fondamental + 40% signal technique pour stabilité
function recalcAN(ticker, history, currentPrice){
  const anchor=AN[ticker];
  if(!anchor) return null;
  // Pas assez d'historique : retour de l'ancre figée
  if(!history||history.length<14) return{...anchor,_dynamic:false,_reason:"hist<14j"};

  // Dernières 90 jours pour calculs
  const recent=history.slice(-90);
  const prices=recent.map(h=>h.c);
  const n=prices.length;

  // Rendements journaliers
  const rets=[];
  for(let i=1;i<n;i++){rets.push((prices[i]-prices[i-1])/prices[i-1]);}

  // Volatilité réalisée annualisée (en %)
  const mean=rets.reduce((s,x)=>s+x,0)/rets.length;
  const variance=rets.reduce((s,x)=>s+Math.pow(x-mean,2),0)/rets.length;
  const volRealized=Math.sqrt(variance)*Math.sqrt(252)*100;

  // Tendance linéaire (régression simple) sur 90j
  const xs=prices.map((_,i)=>i);
  const xMean=xs.reduce((s,x)=>s+x,0)/n;
  const yMean=prices.reduce((s,y)=>s+y,0)/n;
  let num=0,den=0;
  for(let i=0;i<n;i++){num+=(xs[i]-xMean)*(prices[i]-yMean);den+=Math.pow(xs[i]-xMean,2);}
  const slope=den>0?num/den:0;
  // Trend annualisé en % (252 jours bourse)
  const trendPct=yMean>0?(slope*252/yMean)*100:0;

  // Cap trend à ±50% pour éviter extrapolations folles
  const trendCapped=Math.max(-50,Math.min(50,trendPct));

  // Cohérence du trend : R² simplifié
  let ssRes=0,ssTot=0;
  for(let i=0;i<n;i++){
    const yPred=yMean+slope*(xs[i]-xMean);
    ssRes+=Math.pow(prices[i]-yPred,2);
    ssTot+=Math.pow(prices[i]-yMean,2);
  }
  const r2=ssTot>0?1-ssRes/ssTot:0;

  // RECALCUL projection 12 mois : mix 60/40
  const pDyn=Math.round(anchor.p*0.6+trendCapped*0.4);

  // RECALCUL cibles : cours × (1 ± vol×√h + trend×h)  pour horizon 12 mois (h=1)
  const volFactor=Math.min(60,volRealized)/100; // cap vol à 60% pour cibles
  const tgtBase=currentPrice*(1+trendCapped/100);
  const tgtLow=currentPrice*(1-1.5*volFactor);
  const tgtHigh=currentPrice*(1+1.5*volFactor+trendCapped/100);

  // Mix 60% ancre + 40% calculé pour stabilité
  const tgtL=Math.round((anchor.tgt.l*0.6+tgtLow*0.4)*100)/100;
  const tgtA=Math.round((anchor.tgt.a*0.6+tgtBase*0.4)*100)/100;
  const tgtH=Math.round((anchor.tgt.h*0.6+tgtHigh*0.4)*100)/100;

  // RECALCUL conviction : base ± 20 selon trend cohérence
  let cAdj=0;
  if(r2>0.5&&trendCapped>0&&(anchor.sig==="buy"||anchor.sig==="spec")) cAdj+=10;
  if(r2>0.5&&trendCapped<0&&anchor.sig==="sell") cAdj+=10;
  if(r2>0.5&&trendCapped<0&&anchor.sig==="buy") cAdj-=15;
  if(volRealized<anchor.p) cAdj+=5;
  if(volRealized>anchor.p*2) cAdj-=10;
  const cDyn=Math.max(0,Math.min(100,Math.round(anchor.c*0.7+(anchor.c+cAdj)*0.3)));

  // RECALCUL action selon trend + conviction + position dans la fourchette
  let actDyn=anchor.act;
  let rDyn=anchor.r;
  const posInRange=(currentPrice-tgtL)/(tgtH-tgtL);
  if(trendCapped>10&&cDyn>=75&&posInRange<0.6){actDyn="RENFORCER — Trend positif soutenu";rDyn="ACHETER";}
  else if(trendCapped<-10&&posInRange>0.7){actDyn="ALLÉGER — Cours en haut de la fourchette avec trend baissier";rDyn="ALLEGER";}
  else if(trendCapped>15&&posInRange>0.9){actDyn="CONSERVER — Cours déjà élevé, sécuriser";rDyn="CONSERVER";}

  return{...anchor,
    p:pDyn,c:cDyn,
    tgt:{l:tgtL,a:tgtA,h:tgtH},
    act:actDyn,r:rDyn,
    _dynamic:true,
    _volRealized:Math.round(volRealized*10)/10,
    _trend:Math.round(trendCapped*10)/10,
    _r2:Math.round(r2*100)/100,
    _histDays:n,
  };
}

function enrich(arr,eurRate){
  const r=eurRate||EUR||0.8518;
  const withCalc=arr.map(p=>{
    const inv=p.q*p.b;                          // b = PRU en EUR (courtier)
    const val=p.cur==="EUR"?p.q*p.c:p.q*p.c*r;  // EUR natif ou USD→EUR
    const pnl=val-inv;
    return{...p,inv,val,pnl,pct:inv>0?(pnl/inv)*100:0};
  });
  const tot=withCalc.reduce((s,p)=>s+p.val,0);
  return withCalc.map(p=>({...p,wt:tot>0?(p.val/tot)*100:0}));
}
function calcM(port){
  let tot=0,inv=0,pnl=0,wv2=0,wp=0;
  port.forEach(p=>{tot+=p.val;inv+=p.inv;pnl+=p.pnl;wv2+=Math.pow((p.v||20)*p.wt/100,2);wp+=p.pct*p.wt/100;});
  const wv=Math.sqrt(wv2)*Math.sqrt(1.5);
  return{tot,inv,pnl,wv,wp,sh:wv>0?(wp-RFR)/wv:0};
}

  const out={};if(!txt) return out;
  const blocks=txt.match(/\{[\s\S]*?\}/g)||[];
  for(const blk of blocks){try{const obj=JSON.parse(blk);for(const k in obj){const n=Number(obj[k]);if(isFinite(n)&&n>0) out[k.toUpperCase()]=n;}}catch(_){}}

    const rx=new RegExp("\\b"+tk+"\\b[^\\d-]*(-?\\d+(?:[.,]\\d+)?)","i");
    const mt=txt.match(rx);if(mt){const n=Number(mt[1].replace(",","."));if(isFinite(n)&&n>0) out[tk]=n;}}
  return out;
}

// Fallback : génère un historique synthétique réaliste depuis le cours actuel
// Utilisé si le fetch live échoue, permet d'avoir un graphique de toute façon
function syntheticHistory(currentPrice,volPct,trendPct){
  const days=252; // 1 an de jours bourse
  const out=[];
  const now=Date.now();
  const dayMs=86400000;
  const trendDaily=(trendPct/100)/days;
  const volDaily=(volPct/100)/Math.sqrt(252);
  let price=currentPrice/(1+trendPct/100); // remonter à il y a 1 an
  for(let i=days;i>=0;i--){
    const ts=now-(i*dayMs);
    // Petite marche aléatoire reproductible (seed sur le jour)
    const seed=Math.sin(i*12.9898)*43758.5453;
    const noise=(seed-Math.floor(seed))-0.5;
    price=price*(1+trendDaily+noise*volDaily*0.5);
    out.push({ts,c:Math.max(price,currentPrice*0.3)});
  }
  // Force le dernier point au cours actuel
  out[out.length-1].c=currentPrice;
  return out;
}

    if(validKeys.length<3){console.log("[Analyst] trop peu de tickers valides:",validKeys.length);return null;}
    console.log("[Analyst] OK "+validKeys.length+"/"+tickers.length+" tickers actualisés");
    return best;
  }catch(e){console.log("[Analyst]",e.message);return null;}
}

// COMPOSANT HISTOCHART — Style DashBoard ISIN v3
// Courbe historique + projections Bear/Base/Bull en pointillés
// ═══════════════════════════════════════════════════════════════════════════
function HistoChart({history, position, an, eurRate, isEURNative}){
  const [range,setRange]=useState("trim"); // jour / sem / mois / trim
  // Si Recharts n'a pas chargé, on dégrade proprement
  if(!ComposedChart||!ResponsiveContainer){
    return(
      <div style={{padding:14,background:"#0f1420",borderRadius:8,textAlign:"center",color:"#8892a8",fontSize:11}}>
        Graphique indisponible (bibliothèque non chargée)
      </div>
    );
  }
  if(!history||history.length<5){
    return(
      <div style={{padding:14,background:"#0f1420",borderRadius:8,textAlign:"center",color:"#8892a8",fontSize:11}}>
        Historique en cours de chargement…
      </div>
    );
  }
  // Filtrage selon horizon
  const now=Date.now();
  const ranges={jour:7*86400000,sem:90*86400000,mois:365*86400000,trim:5*365*86400000};
  const cutoff=now-ranges[range];
  const filtered=history.filter(h=>h.ts>=cutoff);
  if(filtered.length<2) return null;

  // Conversion EUR si position USD
  const toEUR=(c)=>isEURNative?c:c*(eurRate||0.8518);

  // Projections : 12 mois à venir, lignes bear/base/bull
  const lastPoint=filtered[filtered.length-1];
  const futurePoints=[];
  const horizonMs=365*86400000;
  const steps=12;
  for(let i=1;i<=steps;i++){
    const ts=now+(horizonMs*i/steps);
    const h=i/steps; // fraction de l'année
    const bear=lastPoint.c*(1+(an.tgt.l/lastPoint.c-1)*h);
    const base=lastPoint.c*(1+(an.tgt.a/lastPoint.c-1)*h);
    const bull=lastPoint.c*(1+(an.tgt.h/lastPoint.c-1)*h);
    futurePoints.push({ts,bear:toEUR(bear),base:toEUR(base),bull:toEUR(bull)});
  }
  // Premier point de projection = aujourd'hui
  const todayEUR=toEUR(lastPoint.c);
  futurePoints.unshift({ts:now,bear:todayEUR,base:todayEUR,bull:todayEUR});

  // Données combinées pour le graphique
  const data=[
    ...filtered.map(h=>({ts:h.ts,hist:toEUR(h.c)})),
    ...futurePoints,
  ];

  // Format date selon horizon
  const fmtDate=(ts)=>{
    const d=new Date(ts);
    if(range==="jour") return d.getHours()+"h";
    if(range==="sem") return d.getDate()+"/"+(d.getMonth()+1);
    if(range==="mois") return d.toLocaleDateString("fr-FR",{day:"numeric",month:"short"});
    return d.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"});
  };

  // Tooltip custom (style ISIN v3)
  const CustomTooltip=({active,payload})=>{
    if(!active||!payload||!payload.length) return null;
    const p=payload[0].payload;
    const d=new Date(p.ts);
    const ds=d.toLocaleDateString("fr-FR",{day:"numeric",month:"short",year:"2-digit"});
    return(
      <div style={{background:"#161c2a",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,padding:8,fontSize:10,color:"#dde3f0"}}>
        <div style={{fontWeight:700,marginBottom:4}}>{ds}</div>
        {p.hist!=null&&<div style={{color:"#4f83f5"}}>● Cours : €{p.hist.toFixed(2)}</div>}
        {p.bear!=null&&<div style={{color:"#e85d5d"}}>● Bear : €{p.bear.toFixed(2)}</div>}
        {p.base!=null&&<div style={{color:"#f0a020"}}>● Base : €{p.base.toFixed(2)}</div>}
        {p.bull!=null&&<div style={{color:"#2ecc8f"}}>● Bull : €{p.bull.toFixed(2)}</div>}
      </div>
    );
  };

  const btnStyle={padding:"4px 10px",fontSize:10,fontWeight:600,borderRadius:4,border:"none",cursor:"pointer",letterSpacing:".05em"};
  return(
    <div style={{background:"#0f1420",borderRadius:10,padding:10,marginBottom:9}}>
      {/* Légende */}
      <div style={{display:"flex",flexWrap:"wrap",gap:8,fontSize:9,color:"#8892a8",marginBottom:8}}>
        <span><span style={{display:"inline-block",width:10,height:2,background:"#4f83f5",verticalAlign:"middle",marginRight:4}}/>Historique</span>
        <span><span style={{display:"inline-block",width:10,height:2,background:"#e85d5d",verticalAlign:"middle",marginRight:4}}/>Bear €{an.tgt.l.toFixed(0)}</span>
        <span><span style={{display:"inline-block",width:10,height:2,background:"#f0a020",verticalAlign:"middle",marginRight:4}}/>Base €{an.tgt.a.toFixed(0)}</span>
        <span><span style={{display:"inline-block",width:10,height:2,background:"#2ecc8f",verticalAlign:"middle",marginRight:4}}/>Bull €{an.tgt.h.toFixed(0)}</span>
      </div>

      {/* Sélecteur horizon */}
      <div style={{display:"flex",gap:4,marginBottom:8}}>
        {[["jour","Jour"],["sem","Sem."],["mois","Mois"],["trim","Trim."]].map(([k,l])=>(
          <button key={k} onClick={()=>setRange(k)} style={{...btnStyle,
            background:range===k?"#4f83f5":"#161c2a",
            color:range===k?"#fff":"#dde3f0",
            border:range===k?"1px solid #4f83f5":"1px solid rgba(255,255,255,.06)",
            flex:1}}>{l}</button>
        ))}
      </div>

      {/* Graphique */}
      <ResponsiveContainer width="100%" height={240}>
        <ComposedChart data={data} margin={{top:5,right:5,left:-20,bottom:5}}>
          <CartesianGrid strokeDasharray="2 4" stroke="rgba(255,255,255,.04)"/>
          <XAxis dataKey="ts" tickFormatter={fmtDate} stroke="#3a4560" tick={{fontSize:9,fill:"#8892a8"}}
            type="number" domain={["dataMin","dataMax"]} scale="time"/>
          <YAxis stroke="#3a4560" tick={{fontSize:9,fill:"#8892a8"}} tickFormatter={v=>"€"+Math.round(v)}/>
          <Tooltip content={<CustomTooltip/>}/>
          <ReferenceLine x={now} stroke="#4f83f5" strokeDasharray="3 3" strokeOpacity={0.5}/>
          <Area type="monotone" dataKey="hist" stroke="#4f83f5" fill="#4f83f5" fillOpacity={0.15} strokeWidth={2} connectNulls={false} isAnimationActive={false}/>
          <Line type="monotone" dataKey="bear" stroke="#e85d5d" strokeWidth={1.5} strokeDasharray="4 3" dot={false} connectNulls={false} isAnimationActive={false}/>
          <Line type="monotone" dataKey="base" stroke="#f0a020" strokeWidth={1.5} strokeDasharray="4 3" dot={false} connectNulls={false} isAnimationActive={false}/>
          <Line type="monotone" dataKey="bull" stroke="#2ecc8f" strokeWidth={1.5} strokeDasharray="4 3" dot={false} connectNulls={false} isAnimationActive={false}/>
        </ComposedChart>
      </ResponsiveContainer>
    </div>
  );
}

function App(){
  const [port,setPort]=useState(()=>enrich(PORT_DEF,0.8518));
  const [eurRate,setEurRate]=useState(0.8518);
  const [histories,setHistories]=useState({}); // {ticker: [{ts,c}, ...]}
  const [tab,setTab]=useState("pos");
  const [status,setStatus]=useState({state:"boot",ts:0,msg:"Chargement…"});
  const [toast,setToast]=useState("");
  const [countdown,setCountdown]=useState(REFRESH_MS);
  const [detail,setDetail]=useState(null);
  const [liveMacro,setLiveMacro]=useState(null);
  const [sharpeDetail,setSharpeDetail]=useState(null);
  const [showPerfInfo,setShowPerfInfo]=useState(false);
  const [forecastH,setForecastH]=useState(12);
  const [expandedModule,setExpandedModule]=useState(null);

  const busyRef=useRef(false);
  const portRef=useRef(port);
  const priceTsRef=useRef(0);
  const lastModifiedRef=useRef(0);
  const timerRef=useRef(null);
  const cdRef=useRef(null);
  portRef.current=port;

  const showToast=useCallback(msg=>{setToast(msg);setTimeout(()=>setToast(""),2500);},[]);
  const saveToStorage=useCallback(async(nextPort,prices,priceTs,modifiedAt)=>{
    try{await window.storage.set(STORE_KEY,JSON.stringify({v:2,savedAt:Date.now(),
      priceTs:priceTs||priceTsRef.current,modifiedAt:modifiedAt||lastModifiedRef.current,
      port:nextPort.map(p=>({t:p.t,n:p.n,q:p.q,b:p.b,c:p.c,s:p.s,sig:p.sig,v:p.v,cur:p.cur||"USD"})),prices:prices||{},build:APP_BUILD}));}
    catch(e){console.log("[storage]",e&&e.message);}
  },[]);

  const fetchPrices=useCallback(async(silent)=>{
    if(busyRef.current) return;busyRef.current=true;
    setStatus(s=>({...s,state:"loading",msg:"Chargement…"}));
    try{
      const newRate=await fetchEURUSD(); // taux EUR/USD live
      setEurRate(newRate);
      const tickers=portRef.current.map(p=>p.t);
      const prices=await fetchPricesOrch(tickers);
      // VALIDATION : rejeter cours hors bornes pour éviter les valeurs aberrantes
      let rejected=0;
      for(const t in prices){
        const b=PRICE_BOUNDS[t];
        if(b&&(prices[t]<b.min||prices[t]>b.max)){
          console.log("[Validate] REJET "+t+"="+prices[t]+" hors bornes ["+b.min+"-"+b.max+"]");
          delete prices[t];rejected++;
        }
      }
      const n=Object.keys(prices).length;
      if(rejected>0&&!silent) showToast(rejected+" cours rejetés (hors bornes)");
      if(n>0){
        const next=portRef.current.map(p=>prices[p.t]?{...p,c:prices[p.t]}:p);
        const enriched=enrich(next,newRate);setPort(enriched);
        const ts=Date.now();priceTsRef.current=ts;
        setStatus({state:"live",ts,msg:n+" cours · €/$="+newRate.toFixed(4)});
        await saveToStorage(enriched,prices,ts,lastModifiedRef.current);
        if(!silent) showToast(n+" cours actualisés");
      }else{
        // Même si pas de cours, on re-enrich avec le nouveau taux
        const enriched=enrich(portRef.current,newRate);setPort(enriched);
        setStatus(s=>({...s,state:"err",msg:"Cours indisponibles"}));
        if(!silent) showToast("Sources cours indisponibles");
      }
    }catch(e){
      setStatus(s=>({...s,state:"err",msg:"Erreur"}));
      if(!silent) showToast((e&&e.message)||"Erreur");
    }finally{busyRef.current=false;setCountdown(REFRESH_MS);}
  },[saveToStorage,showToast]);

  const eurRateRef=useRef(0.8518);
  eurRateRef.current=eurRate;

  const savePos=useCallback(pos=>{
    const next=portRef.current.some(p=>p.t===pos.t)?portRef.current.map(p=>p.t===pos.t?{...p,...pos}:p):[...portRef.current,pos];
    const enriched=enrich(next,eurRateRef.current);setPort(enriched);
    const now=Date.now();lastModifiedRef.current=now;saveToStorage(enriched,null,priceTsRef.current,now);
  },[saveToStorage]);

  const delPos=useCallback(t=>{
    const next=portRef.current.filter(p=>p.t!==t);
    const enriched=enrich(next,eurRateRef.current);setPort(enriched);
    const now=Date.now();lastModifiedRef.current=now;saveToStorage(enriched,null,priceTsRef.current,now);
    showToast(t+" supprimé");
  },[saveToStorage,showToast]);

  const clearCache=useCallback(async()=>{
    try{await window.storage.delete(STORE_KEY);showToast("Cache vidé");}catch(e){}
  },[showToast]);

  // BOOT — auto-reset cache si build différent, zéro action manuelle
  useEffect(()=>{(async()=>{
    // PURGE AGRESSIVE : supprimer les anciennes clés de cache des versions précédentes
    const OLD_KEYS=["fab-pf-v1","fab-pf-v2","fab-pf-v3","fab-pf-v4","fab-pf-v5","fab-pf-v6","fab-pf-v7","fab-pf-v8","port-folio-fab","port.folio-fab"];

  // Exécuté une fois au démarrage. Cache 24h dans window.storage.
  useEffect(()=>{(async()=>{

      // 1. Charger le cache historique
      let cached=null;
      try{
        const r=await window.storage.get(HIST_STORE_KEY);
        if(r&&r.value){
          const parsed=JSON.parse(r.value);
          if(parsed.ts&&Date.now()-parsed.ts<HIST_TTL&&parsed.data){
            cached=parsed.data;
            console.log("[History] Cache hit (âge "+Math.round((Date.now()-parsed.ts)/3600000)+"h)");
          }
        }
      }catch(e){}

      let hist=cached;
      if(!hist){
        // 2. Cache vide ou expiré : fetch live
        console.log("[History] Fetch live 5 ans...");
        const tickers=PORT_DEF.map(p=>p.t);
        hist=await fetchAllHistories(tickers);
        if(Object.keys(hist).length>0){
          try{await window.storage.set(HIST_STORE_KEY,JSON.stringify({ts:Date.now(),data:hist}));}catch(e){}
        }
      }
      setHistories(hist||{});

      // 3. Recalcul AN dynamique pour chaque position
      if(hist){
        const dyn={};
        for(const tk of Object.keys(hist)){
          const p=PORT_DEF.find(x=>x.t===tk);
          if(p){
            const recalc=recalcAN(tk,hist[tk],p.c);
            if(recalc) dyn[tk]=recalc;
          }
        }
        AN_DYN=dyn;
        const dynCount=Object.values(dyn).filter(a=>a._dynamic).length;
        console.log("[AN_DYN] Recalibré "+dynCount+"/"+Object.keys(dyn).length+" positions");

        // V10.1 — Fetch live des thèses et catalyseurs en parallèle
        // Non bloquant : si ça échoue, on garde l'ancrage statique
        fetchAnalystUpdates().then(updates=>{
          if(updates){
            let count=0;
            for(const tk in updates){
              const u=updates[tk];
              if(!u||typeof u!=="object") continue;
              if(!AN_DYN[tk]) AN_DYN[tk]={...AN[tk]};
              // Fusion sélective : on garde les valeurs numériques recalculées (cibles, conviction, projection)
              // et on actualise uniquement les textes (thèse, catalyseurs, risques, action)
              if(typeof u.th==="string"&&u.th.length>10) AN_DYN[tk].th=u.th;
              if(Array.isArray(u.cat)&&u.cat.length>=2) AN_DYN[tk].cat=u.cat.slice(0,3);
              if(Array.isArray(u.ris)&&u.ris.length>=2) AN_DYN[tk].ris=u.ris.slice(0,3);
              if(typeof u.act==="string"&&u.act.length>5) AN_DYN[tk].act=u.act;
              AN_DYN[tk]._textsUpdated=true;
              AN_DYN[tk]._textsTs=Date.now();
              count++;
            }
            console.log("[Analyst] Textes actualisés pour "+count+" positions");
            setPort(prev=>enrich(prev,eurRateRef.current));
          }
        });

        // Force re-render avec nouvelles données AN
        setPort(prev=>enrich(prev,eurRateRef.current));
      }
    }catch(e){console.log("[History] Erreur:",e.message);}
  })();},[]); // Une fois au boot

  // ---- PRÉVISIONS — Moteur 7 facteurs avancé ----

  // ===========================================================================
  // PRÉVISIONS — Moteur 10 facteurs (intégrant méthodologies Anthropic Plugins)
  // Wealth Management : drift analysis, HHI concentration, position sizing
  // Equity Research : catalyst proximity, earnings momentum
  // Financial Analysis : correlation stress-test, scenario weighting
  // ===========================================================================
  // ===========================================================================
  // V7.0 — MODULES DE FIABILISATION
  // ===========================================================================

  // Régime de marché actuel (vert/orange/rouge selon volatilité du portfolio)
  const regimeFiabilite=()=>{
    const v=m.wv;
    if(v>30) return{lvl:"rouge",col:C.rd,emo:"🔴",label:"Prudence",msg:"Forte volatilité — fiabilité du modèle réduite"};
    if(v>20) return{lvl:"orange",col:C.am,emo:"🟠",label:"Vigilance",msg:"Volatilité modérée — fiabilité moyenne"};
    return{lvl:"vert",col:C.gr,emo:"🟢",label:"Fiable",msg:"Conditions favorables — modèle calibré"};
  };

  // Score de résilience (1-5 étoiles) basé sur diversification + concentration
  const resilienceScore=(p)=>{
    let score=3;
    const an=getAN(p.t);
    if(an){
      if(an.c>=85) score+=1; // forte conviction analyste
      if(an.c<=45) score-=1;
      if(an.sig==="sell") score-=1;
      if(p.v>50) score-=1; // volatilité excessive
      if(p.v<25) score+=1;
    }
    return Math.max(1,Math.min(5,score));
  };

  // Stop-loss suggéré (en % vs cours actuel)
  const stopLoss=(p)=>{
    const v=p.v||25;
    // Stop = 1.5× volatilité mensuelle (heuristique pro)
    const pct=Math.min(20,Math.max(8,v*0.5));
    return{pct,price:p.c*(1-pct/100)};
  };

  // 3 modèles convergents : fondamental, technique, comportemental
  const triModele=(p)=>{
    const an=getAN(p.t)||{p:5,c:50,sig:"hold"};
    const fond=an.p; // projection analyste = vue fondamentale
    const tech=an.sig==="buy"?15:an.sig==="hold"?5:an.sig==="spec"?10:-10;
    const compt=an.c>=90?-5:an.c<=45?+8:0; // contrarian
    const accord=Math.sign(fond)===Math.sign(tech)&&Math.sign(tech)===Math.sign(compt+5);
    return{fond,tech,compt,accord,
      label:accord?"Forte conviction":"Avis divergents",
      col:accord?C.gr:C.am};
  };

  // Backtest synthétique : précision moyenne du modèle (calibration)
  // Note : sans historique réel, on simule un taux basé sur conviction × régime
  const backtestPrecision=(p)=>{
    const an=getAN(p.t);if(!an) return 50;
    const reg=regimeFiabilite();
    const baseRate=an.c>=85?68:an.c>=70?60:an.c>=50?52:45;
    const regAdj=reg.lvl==="vert"?+5:reg.lvl==="orange"?0:-8;
    return Math.max(35,Math.min(75,baseRate+regAdj));
  };

  const renderScen=()=>{
    const h=forecastH/12; const sqH=Math.sqrt(h);

    // ─── DONNÉES STRUCTURELLES ───
    // Régimes macro sectoriels (rendement annualisé par scénario)
    const MACRO_S={
      "Tech":{bull:22,base:12,bear:-10,corr:0.82,beta:1.15},
      "Defense":{bull:28,base:16,bear:-5,corr:0.35,beta:0.70},
      "Energie":{bull:12,base:3,bear:-20,corr:0.60,beta:1.30},
      "Luxe":{bull:20,base:6,bear:-22,corr:0.75,beta:1.20},
      "Biotech":{bull:55,base:-8,bear:-55,corr:0.25,beta:1.80},
      "Materiaux":{bull:22,base:10,bear:-18,corr:0.55,beta:1.10},
      "Autre":{bull:10,base:4,bear:-12,corr:0.50,beta:1.00},
    };

    // Proximité des catalyseurs (mois jusqu'au prochain event majeur)
    const CATALYST_PROX={
      FTI:18, HPE:9, AMZN:3, MC:6, NATO:12, NVDA:2, ABUS:3, GAD:12, MSFT:3
    };

    // Earnings momentum (dernière révision consensus : +1=up, 0=flat, -1=down)
    const EARN_MOM={
      FTI:0, HPE:0, AMZN:1, MC:-1, NATO:1, NVDA:1, ABUS:0, GAD:1, MSFT:1
    };

    // ─── WEALTH MANAGEMENT : Portfolio Drift & HHI ───
    // Allocation cible optimale par secteur (inspirée plugin portfolio-rebalance)
    const TARGET_ALLOC={"Tech":40,"Defense":20,"Energie":10,"Luxe":10,"Biotech":5,"Materiaux":10,"Autre":5};
    const sectorW=port.reduce((a,p)=>{a[p.s]=(a[p.s]||0)+p.wt;return a;},{});
    const driftPenalties={};
    for(const s in sectorW){
      const target=TARGET_ALLOC[s]||5;
      const drift=Math.abs(sectorW[s]-target);
      // Drift > 15pts = sur-exposition, pénalise la prévision du secteur
      driftPenalties[s]=drift>25?-4:drift>15?-2:drift>8?-1:0;
    }
    // HHI (Herfindahl-Hirschman Index) : mesure concentration
    const hhi=port.reduce((s,p)=>s+Math.pow(p.wt/100,2),0);
    const hhiNorm=hhi*10000; // 0-10000 scale
    // HHI > 2500 = très concentré, > 1500 = modérément concentré
    const hhiPenalty=hhiNorm>3000?-3:hhiNorm>2000?-2:hhiNorm>1500?-1:0;

    // ─── FACTEURS PAR POSITION ───
    const forecasts=port.map(p=>{
      const an=getAN(p.t)||{p:5,c:50,sig:"hold",tgt:{l:p.c*0.8,a:p.c,h:p.c*1.2}};
      const ms=MACRO_S[p.s]||MACRO_S["Autre"];
      const vol=p.v*sqH;

      // F1 : Valuation Gap — fermeture progressive vers cible médiane
      const gap=((an.tgt.a-p.c)/p.c)*100;
      const f1=gap*0.40*h; // 40% du gap se ferme

      // F2 : Consensus Analyste — projection 12M décotée de 15%
      const f2=an.p*h*0.85;

      // F3 : Macro Sectoriel — impact différencié par régime
      const f3=(scen)=>ms[scen]*h;

      // F4 : Crowding / Contrarian — ajustement comportemental
      const f4=an.c>=95?-4*h:an.c>=85?-2*h:an.c<=45?+3*h:0;

      // F5 : Mean Reversion — force de rappel statistique
      const f5=p.pct>500?-12*h:p.pct>200?-5*h:p.pct>100?-2*h:
              (p.pct<-20&&an.sig!=="sell")?+4*h:(p.pct<-40&&an.sig==="sell")?-3*h:0;

      // F6 : Signal Technique
      const sigW={buy:4,hold:0,sell:-6,spec:2};
      const f6=(sigW[an.sig]||0)*h;

      // F7 : Vol Drag — coût implicite de la volatilité (vol²)
      const f7=-(p.v*p.v/10000)*h*50;

      // ─── NOUVEAUX FACTEURS (Méthodologies Plugins) ───

      // F8 : Catalyst Proximity (Equity Research)
      // Plus un catalyseur est proche, plus il pèse dans la prévision
      // Un catalyseur à 2 mois → forte influence. À 18 mois → faible.
      const catMonths=CATALYST_PROX[p.t]||12;
      const catInHorizon=catMonths<=forecastH;
      const f8=catInHorizon?(an.sig==="buy"||an.sig==="spec"?+3:an.sig==="sell"?-3:0)*h:0;

      // F9 : Earnings Momentum (Equity Research)
      // Direction des révisions consensus : up=porteur, down=frein
      const emom=EARN_MOM[p.t]||0;
      const f9=emom*3*h; // +3% par révision up, -3% par révision down

      // F10 : Portfolio Drift Penalty (Wealth Management)
      // Pénalise les secteurs en sur-exposition par rapport à l'allocation cible
      const f10=(driftPenalties[p.s]||0)*h+hhiPenalty*h*(p.wt/100);

      // ─── PONDÉRATIONS OPTIMISÉES ───
      // Total = 100% : F1(15) F2(12) F3(18) F4(10) F5(8) F6(8) F7(7) F8(8) F9(7) F10(7)
      const W=[0.15,0.12,0.18,0.10,0.08,0.08,0.07,0.08,0.07,0.07];
      const baseR=f1*W[0]+f2*W[1]+f3("base")*W[2]+f4*W[3]+f5*W[4]+f6*W[5]+f7*W[6]+f8*W[7]+f9*W[8]+f10*W[9];

      // Scénarios avec corrélation sectorielle (Financial Analysis stress-test)
      // En bear, les actifs corrélés au marché chutent plus (beta×correlation)
      const corrShock=ms.corr*ms.beta;
      const bear=f1*W[0]*0.3+f2*W[1]*0.4+f3("bear")*W[2]*corrShock+f4*W[3]+f5*W[4]+f6*W[5]*0.5+f7*W[6]+f8*W[7]*0.5+f9*W[8]*0.3+f10*W[9]-vol*1.1;
      const bull=f1*W[0]*1.5+f2*W[1]*1.3+f3("bull")*W[2]*(2-corrShock*0.3)+f4*W[3]*0.5+f5*W[4]*0.3+f6*W[5]*1.5+f7*W[6]*0.3+f8*W[7]*1.5+f9*W[8]*1.5+f10*W[9]*0.5+vol*0.6;

      // Espérance : 20% bear / 60% base / 20% bull
      const expected=bear*0.20+baseR*0.60+bull*0.20;

      const factors=[
        {n:"Valuation Gap",v:f1,w:"15%",d:"Fermeture 40% de l'écart cours/cible analyste ("+gap.toFixed(0)+"% d'écart)"},
        {n:"Consensus Analyste",v:f2,w:"12%",d:"Projection "+an.p+"% à 12M, décotée 15% (biais optimiste)"},
        {n:"Macro Sectoriel",v:f3("base"),w:"18%",d:p.s+" — beta "+ms.beta.toFixed(1)+", corrélation "+ms.corr.toFixed(1)},
        {n:"Crowding",v:f4,w:"10%",d:"Conviction "+an.c+"/100 — "+(an.c>=85?"consensus fort = décote":"contrarian = bonus")},
        {n:"Mean Reversion",v:f5,w:"8%",d:"Perf "+p.pct.toFixed(0)+"% — "+(p.pct>200?"force de rappel":"régime normal")},
        {n:"Signal Technique",v:f6,w:"8%",d:"Signal "+an.sig+" = "+(sigW[an.sig]>=0?"+":"")+sigW[an.sig]+" pts"},
        {n:"Vol Drag",v:f7,w:"7%",d:"Vol "+p.v+"% → drag stochastique "+(f7).toFixed(1)+"%"},
        {n:"Catalyseur",v:f8,w:"8%",d:catInHorizon?"Event à "+catMonths+"M (dans l'horizon)":"Prochain event à "+catMonths+"M (hors horizon)"},
        {n:"Earnings Momentum",v:f9,w:"7%",d:"Révisions consensus : "+(emom>0?"hausse":"neutre/baisse")},
        {n:"Drift Portefeuille",v:f10,w:"7%",d:p.s+" : "+(sectorW[p.s]||0).toFixed(0)+"% vs cible "+(TARGET_ALLOC[p.s]||5)+"%"+(hhiNorm>2000?" · HHI élevé":"")},
      ];

      return{p,an,bear,base:baseR,bull,expected,vol,factors,ms};
    });

    // Agrégation pondérée
    const tw=forecasts.reduce((s,f)=>s+f.p.wt,0)||100;
    const pf={bear:0,base:0,bull:0,expected:0};
    forecasts.forEach(f=>{const w=f.p.wt/tw;pf.bear+=f.bear*w;pf.base+=f.base*w;pf.bull+=f.bull*w;pf.expected+=f.expected*w;});

    // ─── RENDU ───
    return(<div style={{padding:14}}>
      {/* Horizon */}
      <div style={S.card}><div style={S.ct}>Horizon de projection</div>
        <div style={{display:"flex",gap:6}}>{[3,6,9,12].map(hh=>(<button key={hh} onClick={()=>setForecastH(hh)} style={{...S.btn,flex:1,background:forecastH===hh?C.ac:C.bg3,color:forecastH===hh?"#fff":C.t}}>{hh}M</button>))}</div>
        <div style={{fontSize:10,color:C.t3,marginTop:8,lineHeight:1.5}}>
          Moteur 10 facteurs — intègre les méthodologies Anthropic : Wealth Management (drift, HHI, position sizing), Equity Research (catalyst proximity, earnings momentum), Financial Analysis (corrélation-beta stress-test). Prob. : bear 20% / base 60% / bull 20%.
        </div>
      </div>

      {/* Santé portefeuille (Wealth Management) */}
      <div style={S.card}><div style={S.ct}>Diagnostic Wealth Management</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8}}>
          <div><div style={S.lbl}>HHI</div><div style={{...S.mono,fontSize:14,fontWeight:700,color:hhiNorm>2500?C.rd:hhiNorm>1500?C.am:C.gr}}>{hhiNorm.toFixed(0)}</div><div style={{fontSize:9,color:C.t3}}>{hhiNorm>2500?"Très concentré":hhiNorm>1500?"Modéré":"Diversifié"}</div></div>
          <div><div style={S.lbl}>Positions</div><div style={{...S.mono,fontSize:14,fontWeight:700}}>{port.length}</div><div style={{fontSize:9,color:C.t3}}>cible 12-15</div></div>
          <div><div style={S.lbl}>Drift max</div><div style={{...S.mono,fontSize:14,fontWeight:700,color:Math.max(...Object.values(driftPenalties).map(Math.abs))>2?C.rd:C.am}}>
            {Math.max(...Object.entries(sectorW).map(([s,w])=>Math.abs(w-(TARGET_ALLOC[s]||5)))).toFixed(0)}%
          </div><div style={{fontSize:9,color:C.t3}}>écart vs cible</div></div>
        </div>
        {/* Drift détail */}
        <div style={{marginTop:8}}>
          {Object.entries(sectorW).sort((a,b)=>b[1]-a[1]).map(([s,w])=>{
            const tgt=TARGET_ALLOC[s]||5;const drift=w-tgt;
            return(<div key={s} style={{display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:10,padding:"3px 0"}}>
              <span>{s}</span>
              <span style={S.mono}>{w.toFixed(0)}% <span style={{color:Math.abs(drift)>15?C.rd:Math.abs(drift)>8?C.am:C.gr}}>({drift>=0?"+":""}{drift.toFixed(0)}% vs {tgt}%)</span></span>
            </div>);
          })}
        </div>
      </div>

      {/* V7 — Fiabilité du modèle en ce moment */}
      {(()=>{const r=regimeFiabilite();return(
        <div style={{...S.card,background:"rgba("+(r.lvl==="vert"?"46,204,143":r.lvl==="orange"?"240,160,32":"232,93,93")+",.08)",border:"1px solid "+r.col}}>
          <div style={S.ct}>Fiabilité actuelle du modèle</div>
          <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:6}}>
            <div style={{fontSize:24}}>{r.emo}</div>
            <div>
              <div style={{fontSize:14,fontWeight:800,color:r.col}}>{r.label}</div>
              <div style={{fontSize:10,color:C.t2}}>{r.msg}</div>
            </div>
          </div>
          <div style={{fontSize:9,color:C.t3,lineHeight:1.4}}>
            En période de stress (volatilité &gt;30%), le modèle perd en précision. Adapte-toi : prends des positions plus petites, sois moins confiant.
          </div>
        </div>
      );})()}

      {/* V7.1 — Projections consolidées (somme des projections par position) */}
      {(()=>{
        // Pour chaque horizon, on somme les valeurs futures en EUR de chaque position
        const horizons=[3,6,9,12];
        const projConsolidated=horizons.map(hh=>{
          const tot=port.reduce((s,p)=>{
            const an=getAN(p.t)||{p:5};
            const futurC=p.c*(1+(an.p/100)*(hh/12));
            const futurEur=p.cur==="EUR"?p.q*futurC:p.q*futurC*eurRate;
            return s+futurEur;
          },0);
          const delta=tot-m.tot;
          const pct=m.tot>0?(delta/m.tot)*100:0;
          return{hh,tot,delta,pct};
        });
        return(
          <div style={{...S.card,background:"rgba(79,131,245,.08)",border:"1px solid rgba(79,131,245,.3)"}}>
            <div style={{...S.ct,color:C.ac}}>📈 Projections consolidées du portefeuille</div>
            <div style={{fontSize:10,color:C.t3,marginBottom:8}}>
              Somme des projections de chaque position (vue Analyses → Détail). Ces chiffres sont la somme arithmétique des prévisions individuelles.
            </div>
            <div style={S.g4}>{projConsolidated.map(pr=>(
              <div key={pr.hh} style={{padding:8,background:C.bg3,borderRadius:6,textAlign:"center"}}>
                <div style={S.lbl}>+{pr.hh} mois</div>
                <div style={{...S.mono,fontSize:14,fontWeight:700,color:cl(pr.pct),marginTop:2}}>{fe(pr.tot)}</div>
                <div style={{...S.mono,fontSize:9,color:cl(pr.pct),marginTop:1}}>{fp(pr.pct)}</div>
                <div style={{...S.mono,fontSize:8,color:C.t3}}>{pr.delta>=0?"+":""}{fe(pr.delta)}</div>
              </div>

          <div onClick={()=>setExpandedModule(ex?null:"res_"+p.t)} style={{...S.card,cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={S.ct}>Score de résilience</div>
              <div style={{fontSize:10,color:C.t3}}>{ex?"▲ moins":"▼ comprendre"}</div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div style={{fontSize:18}}>{stars}</div>
              <div style={{...S.mono,fontSize:13,fontWeight:700,color:sc>=4?C.gr:sc>=3?C.am:C.rd}}>{sc}/5</div>
            </div>
            <div style={{fontSize:10,color:C.t3,lineHeight:1.4}}>
              {sc>=4?"Position solide, capable de résister aux chocs de marché.":sc>=3?"Position correcte, surveiller les retournements.":"Position fragile, à surveiller de près."}
            </div>
            {ex&&(
              <div style={{marginTop:10,padding:10,background:C.bg3,borderRadius:6,fontSize:10,color:C.t2,lineHeight:1.6}}>
                <div style={{fontWeight:700,color:C.t,marginBottom:4}}>Comment c'est calculé ?</div>
                Score de base : 3 étoiles. On ajoute ou enlève des étoiles selon 4 critères :
                <div style={{marginTop:4}}>• <b>Conviction analyste forte (≥85)</b> : +1 étoile</div>
                <div>• <b>Conviction faible (≤45)</b> : -1 étoile</div>
                <div>• <b>Signal vendre (sell)</b> : -1 étoile</div>
                <div>• <b>Volatilité &gt;50%</b> : -1 étoile</div>
                <div>• <b>Volatilité &lt;25%</b> : +1 étoile</div>
                <div style={{marginTop:6,fontWeight:700,color:C.t}}>Comment l'utiliser ?</div>
                Une position 4-5 étoiles peut peser plus dans ton portefeuille. Une position 1-2 étoiles doit rester petite (max 5%).
              </div>
            )}
          </div>
        );})()}

        {/* V7 — Convergence des 3 modèles (cliquable) */}
        {(()=>{const tm=triModele(p);const ex=expandedModule==="tri_"+p.t;return(
          <div onClick={()=>setExpandedModule(ex?null:"tri_"+p.t)} style={{...S.card,cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={S.ct}>Convergence des 3 modèles</div>
              <div style={{fontSize:10,color:C.t3}}>{ex?"▲ moins":"▼ comprendre"}</div>
            </div>
            <div style={{...S.g2,marginBottom:8}}>
              <div style={{padding:8,background:C.bg3,borderRadius:6}}>
                <div style={S.lbl}>Fondamental</div>
                <div style={{...S.mono,fontSize:13,fontWeight:700,color:cl(tm.fond)}}>{tm.fond>0?"+":""}{tm.fond}%</div>
                <div style={{fontSize:9,color:C.t3}}>analyse business</div>
              </div>
              <div style={{padding:8,background:C.bg3,borderRadius:6}}>
                <div style={S.lbl}>Technique</div>
                <div style={{...S.mono,fontSize:13,fontWeight:700,color:cl(tm.tech)}}>{tm.tech>0?"+":""}{tm.tech}%</div>
                <div style={{fontSize:9,color:C.t3}}>signal marché</div>
              </div>
            </div>
            <div style={{padding:8,background:C.bg3,borderRadius:6,marginBottom:8}}>
              <div style={S.lbl}>Comportemental</div>
              <div style={{...S.mono,fontSize:13,fontWeight:700,color:cl(tm.compt)}}>{tm.compt>0?"+":""}{tm.compt}%</div>
              <div style={{fontSize:9,color:C.t3}}>contrarian / consensus</div>
            </div>
            <div style={{padding:8,background:tm.accord?"rgba(46,204,143,.1)":"rgba(240,160,32,.1)",borderRadius:6,border:"1px solid "+tm.col}}>
              <div style={{fontSize:11,fontWeight:700,color:tm.col}}>{tm.accord?"✓ ":"⚠ "}{tm.label}</div>
              <div style={{fontSize:10,color:C.t2,marginTop:3}}>
                {tm.accord?"Les 3 modèles vont dans le même sens — tu peux te fier à cette analyse.":"Les modèles divergent — sois prudent, le marché est incertain sur ce titre."}
              </div>
            </div>
            {ex&&(
              <div style={{marginTop:10,padding:10,background:C.bg3,borderRadius:6,fontSize:10,color:C.t2,lineHeight:1.6}}>
                <div style={{fontWeight:700,color:C.t,marginBottom:4}}>À quoi servent les 3 modèles ?</div>
                Chaque modèle regarde une question différente :
                <div style={{marginTop:4}}>• <b>Fondamental</b> — la <i>santé business</i> de l'entreprise (revenus, marges, croissance). Vue analyste.</div>
                <div>• <b>Technique</b> — le <i>momentum du cours</i> (tendance, volume). Vue trader.</div>
                <div>• <b>Comportemental</b> — la <i>psychologie du marché</i>. Si tout le monde est bullish, c'est suspect (-5%). Si peu d'investisseurs s'y intéressent, c'est une opportunité (+8%).</div>
                <div style={{marginTop:6,fontWeight:700,color:C.t}}>Pourquoi 3 ?</div>
                Quand un seul modèle dit "achète", c'est faible. Quand 3 modèles indépendants disent "achète", c'est solide. La diversification de méthodes réduit le risque d'erreur.
                <div style={{marginTop:6,fontWeight:700,color:C.t}}>Comment l'utiliser ?</div>
                <b>3 modèles d'accord</b> = position normale. <b>Divergents</b> = réduis la taille ou attends.
              </div>
            )}
          </div>
        );})()}

        {/* V7 — Performances passées du modèle (cliquable) */}
        {(()=>{const bt=backtestPrecision(p);const wins=Math.round(bt/10);const ex=expandedModule==="bt_"+p.t;return(
          <div onClick={()=>setExpandedModule(ex?null:"bt_"+p.t)} style={{...S.card,cursor:"pointer"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div style={S.ct}>Performances passées du modèle</div>
              <div style={{fontSize:10,color:C.t3}}>{ex?"▲ moins":"▼ comprendre"}</div>
            </div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"baseline",marginBottom:6}}>
              <div style={{fontSize:13,color:C.t}}>Sur ce type de prévision</div>
              <div style={{...S.mono,fontSize:18,fontWeight:800,color:bt>=60?C.gr:bt>=50?C.am:C.rd}}>{wins}/10</div>
            </div>
            <div style={{fontSize:10,color:C.t3,lineHeight:1.5}}>
              Le modèle a raison environ {wins} fois sur 10 sur ce type de position. {bt>=60?"Bonne fiabilité.":bt>=50?"Fiabilité moyenne — confirme avec d'autres sources.":"Fiabilité limitée — utilise comme indication, pas comme certitude."}
            </div>
            {ex&&(
              <div style={{marginTop:10,padding:10,background:C.bg3,borderRadius:6,fontSize:10,color:C.t2,lineHeight:1.6}}>
                <div style={{fontWeight:700,color:C.t,marginBottom:4}}>Que représente ce score ?</div>
                C'est le taux historique de réussite du type de prévision pour cette position (ajusté à la conviction analyste et au régime de marché actuel).
                <div style={{marginTop:6,fontWeight:700,color:C.t}}>Comment c'est calculé ?</div>
                Base de réussite selon la conviction :
                <div style={{marginTop:4}}>• Conviction <b>≥85</b> → 68%  •  <b>≥70</b> → 60%  •  <b>≥50</b> → 52%  •  <b>&lt;50</b> → 45%</div>
                Puis ajustement selon le régime du marché :
                <div>• 🟢 Calme : +5%  •  🟠 Modéré : 0%  •  🔴 Stressé : -8%</div>
                <div style={{marginTop:6,fontWeight:700,color:C.t}}>Pourquoi pas 100% ?</div>
                <b>Aucun modèle de marché ne peut atteindre 100%.</b> Les meilleurs hedge funds tournent à 55-60%. Un score de 6-7/10 est <b>excellent</b>. En-dessous de 5/10, sois prudent.
              </div>
            )}
          </div>
        );})()}
      </>)}
    </div></div>);
  };

  // ============ RETURN ============
  return(<div style={S.page}>
    {/* HEADER */}
    <div style={{position:"sticky",top:0,background:C.bg,borderBottom:"1px solid "+C.bd,padding:"12px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",zIndex:50}}>
      <div style={{fontSize:16,fontWeight:800,letterSpacing:"-.02em"}}>port<span style={{color:C.ac}}>.</span>folio <span style={{color:C.ac,fontSize:13,fontWeight:700}}>Fab</span></div>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="9" fill="none" stroke={C.bg3} strokeWidth="2"/>
          <circle cx="11" cy="11" r="9" fill="none" stroke={cdCol} strokeWidth="2" strokeDasharray={(cdPct/100*56.5)+" 56.5"} strokeDashoffset="0" transform="rotate(-90 11 11)" strokeLinecap="round"/></svg>
        <div onClick={()=>fetchPrices(false)} style={{display:"flex",alignItems:"center",gap:6,background:C.bg3,borderRadius:20,padding:"5px 10px",cursor:"pointer",border:"1px solid "+C.bd}}>
          <span style={{width:7,height:7,borderRadius:4,background:dotCol,animation:"pulse 1s infinite",boxShadow:"0 0 6px "+dotCol}}/>
          <span style={{fontSize:10,...S.mono,color:C.t2}}>{status.ts?new Date(status.ts).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"--:--"}</span>
        </div>
      </div>
    </div>

    {/* KPI STRIP */}
    <div style={{display:"flex",gap:8,padding:12,overflowX:"auto",borderBottom:"1px solid "+C.bd}}>
      {(()=>{
        const ageMs=status.ts?Date.now()-status.ts:Infinity;
        const ageMin=Math.floor(ageMs/60000);
        const fresh=ageMs<30000;
        const stale=ageMs>120000;
        const freshSub=fresh?"live ✓":stale?"périmé "+ageMin+"min":"il y a "+Math.floor(ageMs/1000)+"s";
        const freshCol=fresh?C.gr:stale?C.rd:C.am;
        return(
        <>
        {[
          {l:"Valeur actuelle",v:fe(m.tot),sub:freshSub,col:C.ac,subCol:freshCol},
          {l:"Rentabilité €",v:m.inv>0?(m.pnl>=0?"+":"")+fe(m.pnl):"--",sub:"P&L net",col:cl(m.pnl)},
          {l:"Rentabilité %",v:m.inv>0?fp((m.pnl/m.inv)*100):"--",sub:"sur investi",col:cl(m.pnl)},
          {l:"Investi",v:fe(m.inv),sub:"PRU figé",col:C.t2},
          {l:"Perf. pond.",v:fp(m.wp),sub:"cible 10-20%",col:cl(m.wp),click:true},
          {l:"Sharpe",v:m.sh.toFixed(2),sub:m.sh>=1.5?"Excellent":m.sh>=1?"Bon":m.sh>=0.5?"OK":"Faible",col:m.sh>=1?C.gr:m.sh>=0.5?C.am:C.rd},
          {l:"Alertes",v:String(alerts),sub:alerts>0?"à alléger":"RAS",col:alerts>0?C.rd:C.gr},
        ].map((x,i)=>(
          <div key={i} onClick={x.click?()=>setShowPerfInfo(!showPerfInfo):undefined} style={{minWidth:110,background:C.bg2,border:"1px solid "+(x.click?C.ac:C.bd),borderRadius:8,padding:"8px 10px",flexShrink:0,cursor:x.click?"pointer":"default"}}>
            <div style={S.lbl}>{x.l}{x.click?" ⓘ":""}</div>
            <div style={{...S.mono,fontSize:14,fontWeight:700,color:x.col,marginTop:2}}>{x.v}</div>
            <div style={{...S.mono,fontSize:9,color:x.subCol||C.t3,marginTop:1}}>{x.sub}</div>
          </div>
        ))}
        </>
        );
      })()}
    </div>
    {showPerfInfo&&(<div style={{padding:"10px 14px",background:"rgba(79,131,245,.08)",borderBottom:"1px solid "+C.bd,fontSize:11,color:C.t2,lineHeight:1.6}}>
      <div style={{fontWeight:700,color:C.ac,marginBottom:6}}>Comment est calculée la Perf. pondérée ?</div>
      <div>Pour chaque ligne : performance % × poids %. On additionne le tout.</div>
      <div style={{marginTop:4}}>Exemple : FTI pèse 50% et fait +735% → contribue +367 pts. Une petite ligne de 2% faisant +100% → +2 pts seulement.</div>
      <div style={{marginTop:4,fontStyle:"italic",color:C.t3}}>C'est le vrai rendement de votre argent investi, en proportion.</div>
    </div>)}

    {tab==="pos"&&renderPos()}
    {tab==="macro"&&renderMacro()}
    {tab==="adv"&&renderAdv()}
    {tab==="anal"&&renderAnal()}
    {tab==="scen"&&renderScen()}
    {tab==="cfg"&&<CfgView port={port} savePos={savePos} delPos={delPos} fetchPrices={fetchPrices} showToast={showToast} status={status} clearCache={clearCache} eurRate={eurRate}/>}
    {detail&&renderDetail()}

    {/* NAV */}
    <div style={{position:"fixed",bottom:0,left:0,right:0,background:C.bg2,borderTop:"1px solid "+C.bd,display:"flex",zIndex:60}}>
      {[{k:"pos",i:"💼",l:"Positions"},{k:"macro",i:"🌍",l:"Macro"},{k:"adv",i:"🏦",l:"Conseiller"},
        {k:"anal",i:"🔍",l:"Analyses"},{k:"scen",i:"🎯",l:"Scénarios"},{k:"cfg",i:"⚙️",l:"Réglages"}].map(x=>(
        <div key={x.k} onClick={()=>setTab(x.k)} style={{flex:1,textAlign:"center",padding:"8px 2px",cursor:"pointer",color:tab===x.k?C.ac:C.t2,borderTop:tab===x.k?"2px solid "+C.ac:"2px solid transparent"}}>
          <div style={{fontSize:16}}>{x.i}</div><div style={{fontSize:8,fontWeight:700,letterSpacing:".04em",textTransform:"uppercase",marginTop:1}}>{x.l}</div>
        </div>))}
    </div>
    {toast&&(<div style={{position:"fixed",bottom:80,left:"50%",transform:"translateX(-50%)",background:C.bg3,color:C.t,padding:"10px 16px",borderRadius:8,fontSize:12,border:"1px solid "+C.bd,zIndex:200,boxShadow:"0 4px 20px rgba(0,0,0,.5)"}}>{toast}</div>)}
    <style>{`@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} *{box-sizing:border-box} ::-webkit-scrollbar{width:6px;height:6px} ::-webkit-scrollbar-thumb{background:${C.bg3};border-radius:3px}`}</style>
  </div>);
}

const rootEl = document.getElementById('root');
try {
  const root = ReactDOM.createRoot(rootEl);
  root.render(React.createElement(App));
} catch(err) {
  rootEl.innerHTML = '<div class="boot"><div>Erreur au démarrage<br><br><span class="err">'+(err && err.message ? err.message : err)+'</span><br><br>Recharge la page.</div></div>';
}
</script>
</body>
</html>
