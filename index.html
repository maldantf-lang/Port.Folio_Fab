function computeDynShocks(scenarioId, ctx) {
  const base = STRESS_SCENARIOS.find(s => s.id === scenarioId);
  if(!base) return null;
  const shocks = Object.assign({}, base.shocks);
  const notes = [];
  const hasCtx = ctx && Object.keys(ctx).length > 0;

  if(scenarioId === "fed100" && hasCtx) {
    // TLT < 88 → taux très élevés → coupe impacte davantage croissance
    const m = ctx.tlt ? (ctx.tlt < 88 ? 1.35 : ctx.tlt < 96 ? 1.10 : 0.90) : 1;
    shocks.Tech = +(base.shocks.Tech * m).toFixed(3);
    shocks.Luxe = +(base.shocks.Luxe * m).toFixed(3);
    shocks.Biotech = +(base.shocks.Biotech * m).toFixed(3);
    if(ctx.tlt) notes.push("TLT " + ctx.tlt.toFixed(0) + " → taux " + (ctx.tlt < 90 ? "très élevés : coupe = boost fort growth ↑" : ctx.tlt < 96 ? "élevés : coupe = boost modéré" : "normaux : coupe = impact limité"));
  }

  if(scenarioId === "tech30" && hasCtx) {
    // QQQ élevé → valorisation étendue → correction plus sévère
    const m = ctx.qqq ? (ctx.qqq > 490 ? 1.25 : ctx.qqq > 420 ? 1.00 : 0.70) : 1;
    shocks.Tech = +(base.shocks.Tech * m).toFixed(3);
    shocks.Luxe = +(base.shocks.Luxe * Math.min(1.2, m * 0.8)).toFixed(3);
    if(ctx.qqq) notes.push("QQQ " + ctx.qqq.toFixed(0) + " → Tech " + (ctx.qqq > 490 ? "valorisation étendue : correction amplifiée ↑" : ctx.qqq > 420 ? "valorisation normale" : "déjà corrigée : choc atténué ↓"));
  }

  if(scenarioId === "taiwan" && hasCtx) {
    // ITA élevé → défense déjà pricée → upside plus limité
    const dm = ctx.ita ? (ctx.ita > 160 ? 0.75 : ctx.ita > 130 ? 1.00 : 1.25) : 1;
    shocks.Défense = +(base.shocks.Défense * dm).toFixed(3);
    const tm = ctx.qqq ? (ctx.qqq > 480 ? 1.20 : 0.90) : 1;
    shocks.Tech = +(base.shocks.Tech * tm).toFixed(3);
    if(ctx.ita) notes.push("ITA " + ctx.ita.toFixed(0) + " → Défense " + (ctx.ita > 155 ? "déjà valorisée, upside limité" : "upside disponible"));
    if(ctx.qqq) notes.push("QQQ " + ctx.qqq.toFixed(0) + " → impact semi-conducteurs " + (ctx.qqq > 480 ? "amplifié" : "modéré"));
  }

  // Contexte général : GLD élevé = stress marché → amplifie chocs négatifs
  if(hasCtx && ctx.gld && ctx.gld > 2500) {
    const stressMult = Math.min(1.2, 1 + (ctx.gld - 2500) / 5000);
    Object.keys(shocks).forEach(k => { if(shocks[k] < 0) shocks[k] = +(shocks[k] * stressMult).toFixed(3); });
    notes.push("Or " + ctx.gld.toFixed(0) + " $ → stress marché élevé, chocs négatifs amplifiés");
  }

  return { sc: base, shocks, desc: base.desc, notes, ctx: ctx||{}, dynamic: hasCtx };
}
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(SNAP_STORE)) {
        const s = db.createObjectStore(SNAP_STORE, { keyPath: "ts" });
        s.createIndex("date", "date", { unique: false });
      }
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function snapshotAdd(snap) {
  try {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(SNAP_STORE, "readwrite");
      tx.objectStore(SNAP_STORE).put(snap);
      tx.oncomplete = () => { db.close(); res(); };
      tx.onerror = () => { db.close(); rej(tx.error); };
    });
  } catch(e) { console.warn("[DB] add err", e); }
}
async function snapshotsRange(fromTs) {
  try {
    const db = await openDB();
    return new Promise((res) => {
      const tx = db.transaction(SNAP_STORE, "readonly");
      const out = [];
      const req = tx.objectStore(SNAP_STORE).openCursor();
      req.onsuccess = (e) => {
        const c = e.target.result;
        if (c) { if (c.value.ts >= fromTs) out.push(c.value); c.continue(); }
        else { db.close(); res(out); }
      };
      req.onerror = () => { db.close(); res([]); };
    });
  } catch(e) { return []; }
}

async function fetchOne(url, isWrap) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 9000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    const data = isWrap ? JSON.parse(j.contents) : j;
    const px = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
    if (!isFinite(px) || px <= 0) throw new Error("invalid price");
    return px;
  } catch(e) { clearTimeout(to); throw e; }
}

/* ============== CALCULS ============== */
function priceEUR(t, prices, eurusd) {
  const meta = YF[t]; const px = prices[t];
  if (px == null || !meta) return null;
  return meta.ccy === "EUR" ? px : px / eurusd;
}
function enrich(port, prices, eurusd) {
  const items = port.map(p => {
    const inv = p.q * p.b;
    const pxE = priceEUR(p.t, prices, eurusd);
    const val = pxE != null ? p.q * pxE : null;
    const pnl = val != null ? val - inv : null;
    const pct = (val != null && inv > 0) ? (pnl / inv) * 100 : null;
    return { ...p, inv, pxE, val, pnl, pct };
  });
  const tot = items.reduce((s,p) => s + (p.val || 0), 0);
  return items.map(p => ({ ...p, wt: tot > 0 && p.val ? (p.val/tot)*100 : 0 }));
}
function metrics(port) {
  let tot=0, inv=0, pnl=0, wv2=0, wp=0, miss=0;
  port.forEach(p => {
    inv += p.inv;
    if (p.val == null) { miss++; return; }
    tot += p.val; pnl += p.pnl;
    wv2 += Math.pow((p.v||20) * p.wt/100, 2);
    wp  += (p.pct||0) * p.wt / 100;
  });
  const wv = Math.sqrt(wv2) * Math.sqrt(1.5);
  return { tot, inv, pnl, wv, wp, sh: wv > 0 ? (wp - 3.5) / wv : 0, miss };
}

/* ============== SCORE DE SANTÉ ============== */
function calcHealth(port, m) {
  const valid = port.filter(p => p.val != null && p.wt > 0);
  const n = valid.length || 1;
  const hhi = valid.reduce((s,p) => s + Math.pow(p.wt/100, 2), 0);
  const hhiNorm = n > 1 ? (hhi - 1/n) / (1 - 1/n) : 1;
  const div = Math.round(25 * (1 - Math.min(1, hhiNorm)));
  const wPos = valid.filter(p => p.pct != null && p.pct > 0).reduce((s,p) => s + p.wt, 0);
  const res = Math.round(25 * wPos / 100);
  const momNorm = Math.min(1, Math.max(0, (m.wp + 20) / 40));
  const mom = Math.round(25 * momNorm);
  let convW = 0, convTot = 0;
  valid.forEach(p => { const a = AN[p.t]; if(a) { convW += a.c * p.wt; convTot += p.wt; }});
  const conv = convTot > 0 ? Math.round(25 * convW / convTot / 100) : 12;
  return { total: div+res+mom+conv, div, res, mom, conv };
}

/* ============== ALERTES SEUILS ============== */
function smartThresholds(pos, pxE) {
  // Calcul intelligent des seuils par défaut basés sur PRU et volatilité
  const v = pos.v || 25;
  const lo = +(pos.b * (1 - Math.min(0.20, v/100 * 0.5))).toFixed(2);
  const hi = +(pos.b * (1 + Math.min(0.40, v/100 * 1.0))).toFixed(2);
  return { lo, hi };
}
function checkAlerts(port, alerts, prices, eurusd, lastNotifRef) {
  const now = Date.now();
  port.forEach(p => {
    const pxE = priceEUR(p.t, prices, eurusd);
    if (pxE == null) return;
    const a = alerts[p.t]; if (!a || !a.on) return;
    const lastT = lastNotifRef[p.t] || 0;
    if (now - lastT < 3600000) return; // 1h cooldown par ticker
    if (a.hi && pxE >= a.hi) {
      notify(`🎯 ${p.t} a atteint le seuil HAUT`, `${pxE.toFixed(2)}€ ≥ ${a.hi}€ — prise de profit`);
      lastNotifRef[p.t] = now;
    } else if (a.lo && pxE <= a.lo) {
      notify(`⚠️ ${p.t} sous le seuil BAS`, `${pxE.toFixed(2)}€ ≤ ${a.lo}€ — stop-loss`);
      lastNotifRef[p.t] = now;
    }
  });
}

/* ============== MOTEUR PRÉVISION 10 FACTEURS ============== */
function forecast(pos, mac) {
  const an = AN[pos.t] || {};
  // 10 facteurs (compactés) : conviction, momentum sectoriel, signal, volatilité, position cycle, etc.
  const f1 = (an.c || 50) / 100;          // conviction analyste
  const f2 = an.sig === "buy" ? 1 : an.sig === "sell" ? -1 : an.sig === "spec" ? .3 : 0;
  const f3 = (an.p || 0) / 100;           // proj 12M brute
  const f4 = pos.sig === "buy" ? .6 : pos.sig === "sell" ? -.4 : 0;
  const f5 = (pos.v || 25) / 100;         // volatilité
  const f6 = pos.pct != null ? Math.tanh(pos.pct/100) : 0; // momentum perso
  const f7 = ["IA","Tech","Défense","Énergie"].includes(pos.s) ? .15 : 0; // tailwind sectoriel
  const f8 = pos.s === "Énergie" && pos.sig === "sell" ? -.10 : 0;
  const f9 = mac && mac.regime?.includes("stagflation") ? -.05 : 0;
  const f10 = an.tgt ? (an.tgt.a / Math.max(0.01, pos.b) - 1) * 0.3 : 0;
  const mu12 = f3*0.5 + f2*0.06 + f4*0.04 + f6*0.08 + f7 + f8 + f9 + f10*0.4;
  const sigma12 = Math.max(0.10, f5 * 1.2);
  // P10/P50/P90
  return {
    p10: mu12 - 1.28 * sigma12,
    p50: mu12,
    p90: mu12 + 1.28 * sigma12,
    sigma: sigma12,
    factors: { f1,f2,f3,f4,f5,f6,f7,f8,f9,f10 }
  };
}

function HistoryView({ snapshots, port }) {
  const [period, setPeriod] = useState("30j");
  const days = period === "7j" ? 7 : period === "30j" ? 30 : period === "90j" ? 90 : 99999;
  const cutoff = Date.now() - days * 86400000;
  const data = snapshots.filter(s => s.ts >= cutoff).map(s => ({
    ts: s.ts,
    date: new Date(s.ts).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}),
    val: s.tot, pnl: s.pnl, inv: s.inv
  }));
  const cur    = port.reduce((s,p)=>s+(p.val||0),0);
  const curPnl = port.reduce((s,p)=>s+(p.pnl||0),0);
  const curInv = port.reduce((s,p)=>s+p.inv,0);
  const first  = data.length > 0 ? data[0].val : cur;
  const delta  = cur - first;
  const deltaPct = first > 0 ? (delta/first)*100 : 0;

  const allVals  = data.map(d=>d.val).concat([cur]);
  const peak     = allVals.length ? Math.max(...allVals) : cur;
  const trough   = allVals.length ? Math.min(...allVals) : cur;
  const drawdown = peak > 0 ? ((trough-peak)/peak)*100 : 0;
  const firstDate = data.length > 0 ? new Date(data[0].ts).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"2-digit"}) : "—";

  const contribs = port.filter(p=>p.val!=null&&p.pnl!=null)
    .map(p=>({t:p.t,n:p.n,pnl:p.pnl,pct:p.pct,wt:p.wt}))
    .sort((a,b)=>b.pnl-a.pnl);
  const maxAbsPnl = Math.max(...contribs.map(x=>Math.abs(x.pnl)), 0.01);

  return (
    <>
      <div className="card">
        <div className="cd-ti">
          <h3>Valeur du portefeuille</h3>
          <span className="num" style={{fontSize:12,color:cl(delta)}}>{fp(deltaPct)} • {fe(delta)}</span>
        </div>
        <div className="seg">
          {["7j","30j","90j","tout"].map(k=>
            <div key={k} className={"it"+(period===k?" ac":"")} onClick={()=>setPeriod(k)}>{k}</div>
          )}
        </div>
        {data.length < 2 ? (
          <div className="warn">Historique en cours de constitution — {snapshots.length} snapshot{snapshots.length>1?"s":""}. Premiers points dans quelques jours d'utilisation continue.</div>
        ) : (
          <div style={{height:200,marginTop:8}}>
            <ResponsiveContainer>
              <AreaChart data={data} margin={{top:5,right:5,left:0,bottom:0}}>
                <defs>
                  <linearGradient id="gv" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#4f83f5" stopOpacity={0.4}/>
                    <stop offset="100%" stopColor="#4f83f5" stopOpacity={0}/>
                  </linearGradient>
                </defs>
                <CartesianGrid stroke="rgba(255,255,255,.04)" vertical={false}/>
                <XAxis dataKey="date" stroke="#3a4560" fontSize={10} tickLine={false}/>
                <YAxis stroke="#3a4560" fontSize={10} tickLine={false} axisLine={false}
                  tickFormatter={v=>v.toFixed(0)+"€"} width={45}/>
                <Tooltip contentStyle={{background:"#0f1420",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,fontSize:12}}
                  formatter={v=>[fe(v),"Valeur"]}/>
                <Area type="monotone" dataKey="val" stroke="#4f83f5" strokeWidth={2} fill="url(#gv)"/>
              </AreaChart>
            </ResponsiveContainer>
          </div>
        )}
      </div>

      {data.length >= 2 && (
        <div className="card">
          <div className="cd-ti">
            <h3>P&amp;L cumulé</h3>
            <span className="num" style={{fontSize:12,color:cl(curPnl)}}>{fe(curPnl)} <span className="dim" style={{fontWeight:400}}>({fp(curPnl/curInv*100,1)})</span></span>
          </div>
          <div style={{height:160}}>
            <ResponsiveContainer>
              <AreaChart data={data} margin={{top:5,right:5,left:0,bottom:0}}>
                <defs>
                  <linearGradient id="gpnl" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stopColor="#2ecc8f" stopOpacity={0.35}/>
                    <stop offset="100%" stopColor="#2ecc8f" stopOpacity={0}/>
                  </linearGradient>
                </defs>
                <CartesianGrid stroke="rgba(255,255,255,.04)" vertical={false}/>
                <XAxis dataKey="date" stroke="#3a4560" fontSize={10} tickLine={false}/>
                <YAxis stroke="#3a4560" fontSize={10} tickLine={false} axisLine={false}
                  tickFormatter={v=>v.toFixed(0)+"€"} width={45}/>
                <Tooltip contentStyle={{background:"#0f1420",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,fontSize:12}}
                  formatter={v=>[fe(v),"P&L"]}/>
                <ReferenceLine y={0} stroke="rgba(255,255,255,.15)" strokeDasharray="3 3"/>
                <Area type="monotone" dataKey="pnl" stroke="#2ecc8f" strokeWidth={2} fill="url(#gpnl)"/>
              </AreaChart>
            </ResponsiveContainer>
          </div>
        </div>
      )}

      <div className="card">
        <div className="cd-ti"><h3>Statistiques de la période</h3><span className="dim" style={{fontSize:10}}>depuis {firstDate}</span></div>
        <div className="g3">
          <div><div className="lbl">Plus-haut</div><div className="mono" style={{fontSize:14,color:"#2ecc8f"}}>{fe(peak,0)}</div></div>
          <div><div className="lbl">Plus-bas</div><div className="mono" style={{fontSize:14}}>{fe(trough,0)}</div></div>
          <div><div className="lbl">Drawdown max</div><div className="mono" style={{fontSize:14,color:"#e85d5d"}}>{fp(drawdown,1)}</div></div>
        </div>
        <div className="g3" style={{marginTop:8,paddingTop:8,borderTop:"1px solid rgba(255,255,255,.04)"}}>
          <div><div className="lbl">Investi</div><div className="mono" style={{fontSize:13}}>{fe(curInv)}</div></div>
          <div><div className="lbl">Valeur</div><div className="mono" style={{fontSize:13}}>{fe(cur)}</div></div>
          <div><div className="lbl">Snapshots</div><div className="mono" style={{fontSize:13}}>{snapshots.length}</div></div>
        </div>
      </div>

      <div className="card">
        <div className="cd-ti"><h3>Contributions P&amp;L</h3><span className="dim" style={{fontSize:10}}>tri meilleur → pire</span></div>
        {contribs.map(p=>(
          <div key={p.t} className="row" style={{gap:6,alignItems:"center"}}>
            <div style={{flex:"0 0 28%"}}>
              <div className="tk" style={{fontSize:12}}>{p.t}</div>
              <div className="dim" style={{fontSize:9}}>{fp(p.wt,0)} du portef.</div>
            </div>
            <div style={{flex:1}}>
              <div className="bar">
                <span style={{width:Math.abs(p.pnl)/maxAbsPnl*100+"%",background:p.pnl>=0?"#2ecc8f":"#e85d5d"}}/>
              </div>
            </div>
            <div className="num" style={{flex:"0 0 64px",color:cl(p.pnl),fontSize:11}}>{fe(p.pnl)}</div>
            <div className="num" style={{flex:"0 0 44px",fontSize:10,color:cl(p.pct)}}>{fp(p.pct,0)}</div>
          </div>
        ))}
      </div>

      <div className="dim" style={{fontSize:9,textAlign:"center",marginBottom:8}}>
        {snapshots.length} snapshot{snapshots.length>1?"s":""} · IndexedDB · rafraîchi toutes les 5 min
      </div>
    </>
  );
}

  const [addTk, setAddTk] = useState("");
  const [simTk, setSimTk] = useState(OPPS[0] ? OPPS[0].t : "");
  const [simQty, setSimQty] = useState("");
  const [simPx, setSimPx] = useState("");
  const [simRes, setSimRes] = useState(null);
  const [watchAnalysis] = useState({});  // données statiques OPPS uniquement

  const top = port.find(p => p.wt > 35);
  const sells = port.filter(p => p.sig === "sell" && p.val != null);
  const buys = port.filter(p => p.sig === "buy" && p.val != null).sort((a,b)=>(AN[b.t]?.c||0)-(AN[a.t]?.c||0));

  const fetchWatchPrices = async () => {
    setWatchLoading(true);
    const r = {};
    await Promise.all(watchList.map(async tk => { try { r[tk] = await fetchSymbol(tk); } catch(e){} }));
    setWatchPrices(prev=>({...prev,...r})); setWatchLoading(false);
  };

  useEffect(() => {
    if(sub==="watch" && watchList.length>0) fetchWatchPrices();
  }, [sub]);

  const addWatch = () => {
    const t = addTk.toUpperCase().trim(); if(!t||watchList.includes(t)) return;
    const next=[...watchList,t]; setWatchList(next); saveWatch(next); setAddTk("");
  };
  const removeWatch = t => { const next=watchList.filter(x=>x!==t); setWatchList(next); saveWatch(next); };

  const simulate = () => {
    const qty=parseFloat(simQty), px=parseFloat(simPx);
    if(!simTk||!qty||!(px>0)) return;
    const newVal=qty*px, newTot=m.tot+newVal;
    const curHHI=port.filter(p=>p.val).reduce((s,p)=>s+Math.pow(p.val/m.tot,2),0);
    const newHHI=[...port.filter(p=>p.val).map(p=>p.val),newVal].reduce((s,v)=>s+Math.pow(v/newTot,2),0);
    const opp=OPPS.find(o=>o.t===simTk.toUpperCase())||{s:"Autre"};
    const curSec=port.filter(p=>p.s===opp.s).reduce((s,p)=>s+(p.val||0),0);
    const newVolEst=Math.sqrt(Math.pow(m.wv*m.tot/newTot,2)+Math.pow(35*newVal/newTot,2));
    setSimRes({newVal,newTot,curHHI,newHHI,sec:opp.s,newSecPct:(curSec+newVal)/newTot*100,newWt:newVal/newTot*100,curVol:m.wv,newVolEst});
  };

  return (

          {top && <div className="err" onClick={()=>onSelect(top.t)} style={{cursor:"pointer"}}><strong>🚨 CONCENTRATION CRITIQUE</strong> — {top.t} représente {fp(top.wt,0)} du portefeuille. Diversifier prioritairement.</div>}

function ScenariosView({ port, m }) {
  const [horizon, setHorizon] = useState(12);
  const [activeStress, setActiveStress] = useState(null);
  const [macroCtx, setMacroCtx] = useState(() => loadMacroCtx() || {});
  const [ctxLoading, setCtxLoading] = useState(false);
  const h = horizon / 12;

  // Charger / rafraîchir le contexte macro
  const refreshCtx = async () => {
    setCtxLoading(true);
    const ctx = await fetchMacroCtx();
    setMacroCtx(ctx);
    setCtxLoading(false);
  };

  useEffect(() => {
    if(!macroCtx || Object.keys(macroCtx).length === 0) refreshCtx();
  }, []);

  const handleStressClick = (sc) => {
    setActiveStress(activeStress === sc.id ? null : sc.id);
  };

  const stressResult = useMemo(() => {
    if(!activeStress) return null;
    return computeDynShocks(activeStress, macroCtx);
  }, [activeStress, macroCtx, port]);

  // Backtest stub - cherche un snapshot vieux de ~3M
  const [backtest, setBacktest] = useState(null);
  useEffect(() => {
    snapshotsRange(Date.now() - 100*86400000).then(arr => {
      if (arr.length === 0) { setBacktest({ available:false }); return; }
      const target = Date.now() - 90*86400000;
      const closest = arr.reduce((a,b) => Math.abs(b.ts-target)<Math.abs(a.ts-target)?b:a);
      const ageDays = Math.round((Date.now() - closest.ts)/86400000);
      if (ageDays < 60) { setBacktest({ available:false, ageDays }); return; }
      const realPct = closest.tot > 0 ? ((m.tot - closest.tot)/closest.tot)*100 : 0;
      const predPct = (closest.pred3M || 0);
      setBacktest({ available:true, ageDays, realPct, predPct, gap: realPct - predPct });
    });
  }, [m.tot]);

  const items = port.map(p => {
    if (p.val == null) return null;
    const f = forecast(p, MACRO);
    return {
      t: p.t,
      val: p.val,
      p10: p.val * (1 + f.p10 * h),
      p50: p.val * (1 + f.p50 * h),
      p90: p.val * (1 + f.p90 * h)
    };
  }).filter(Boolean);
  const tot10 = items.reduce((s,x)=>s+x.p10,0);
  const tot50 = items.reduce((s,x)=>s+x.p50,0);
  const tot90 = items.reduce((s,x)=>s+x.p90,0);

  // Calcul impacts portefeuille avec chocs dynamiques
  const stressImpact = useMemo(() => {
    if(!stressResult) return null;
    const items = port.filter(p => p.val != null).map(p => {
      const shock = stressResult.shocks[p.s] || 0;
      return { t:p.t, val:p.val, s:p.s, shockPct:shock*100, after:p.val*(1+shock) };
    });
    const totB = items.reduce((s,x)=>s+x.val, 0);
    const totA = items.reduce((s,x)=>s+x.after, 0);
    const top3 = [...items].sort((a,b)=>Math.abs(b.shockPct)-Math.abs(a.shockPct)).slice(0,3);
    return { items, totB, totA, delta:totA-totB, deltaPct:(totA-totB)/totB*100, top3 };
  }, [stressResult, port]);

  return (
    <>
      <div className="card">
        <div className="cd-ti">
          <h3>Stress-tests dynamiques</h3>
          <button className="bn bn-b ic-only" onClick={refreshCtx} title="Actualiser le contexte marché">
            {ctxLoading ? "…" : "↻"}
          </button>
        </div>
        {/* Contexte marché */}
        {Object.keys(macroCtx).length > 0 ? (
          <div style={{display:"flex",gap:8,marginBottom:10,flexWrap:"wrap"}}>
            {macroCtx.qqq && <span style={{background:"rgba(79,131,245,.1)",border:"1px solid rgba(79,131,245,.2)",borderRadius:5,padding:"3px 8px",fontSize:10,color:"#8892a8"}}>QQQ <strong style={{color:"#dde3f0"}}>${macroCtx.qqq.toFixed(0)}</strong></span>}
            {macroCtx.tlt && <span style={{background:"rgba(79,131,245,.1)",border:"1px solid rgba(79,131,245,.2)",borderRadius:5,padding:"3px 8px",fontSize:10,color:"#8892a8"}}>TLT <strong style={{color:"#dde3f0"}}>${macroCtx.tlt.toFixed(0)}</strong></span>}
            {macroCtx.ita && <span style={{background:"rgba(79,131,245,.1)",border:"1px solid rgba(79,131,245,.2)",borderRadius:5,padding:"3px 8px",fontSize:10,color:"#8892a8"}}>ITA <strong style={{color:"#dde3f0"}}>${macroCtx.ita.toFixed(0)}</strong></span>}
            {macroCtx.gld && <span style={{background:"rgba(79,131,245,.1)",border:"1px solid rgba(79,131,245,.2)",borderRadius:5,padding:"3px 8px",fontSize:10,color:"#8892a8"}}>GLD <strong style={{color:macroCtx.gld>2500?"#e85d5d":"#dde3f0"}}>${macroCtx.gld.toFixed(0)}</strong></span>}
          </div>
        ) : (
          <div className="dim" style={{fontSize:10,marginBottom:8}}>{ctxLoading ? "⌛ Chargement contexte marché…" : "Contexte non chargé — appuie sur ↻"}</div>
        )}
        {/* Boutons scénarios */}
        <div className="g3" style={{marginBottom:stressImpact?10:0}}>
          {STRESS_SCENARIOS.map(sc=>(
            <button key={sc.id} onClick={()=>handleStressClick(sc)}
              style={{background:activeStress===sc.id?"rgba(79,131,245,.25)":"#161c2a",border:activeStress===sc.id?"1px solid #4f83f5":"1px solid rgba(255,255,255,.06)",borderRadius:8,padding:"8px 6px",cursor:"pointer",textAlign:"center"}}>
              <div style={{fontSize:18,marginBottom:2}}>{sc.emoji}</div>
              <div style={{fontSize:9,fontWeight:800,color:activeStress===sc.id?"#4f83f5":"#8892a8",letterSpacing:".03em",lineHeight:1.3}}>{sc.label}</div>
            </button>
          ))}
        </div>
        {/* Résultats */}
        {stressResult && stressImpact && (
          <>
            <div style={{fontSize:11,color:"#8892a8",marginBottom:8,lineHeight:1.4}}>{stressResult.desc}</div>
            {/* Notes dynamiques */}
            {stressResult.dynamic && stressResult.notes.length > 0 && (
              <div style={{background:"rgba(79,131,245,.06)",borderRadius:6,padding:"8px 10px",marginBottom:10}}>
                {stressResult.notes.map((n,i)=>(
                  <div key={i} style={{fontSize:10,color:"#4f83f5",marginBottom:i<stressResult.notes.length-1?4:0}}>📊 {n}</div>
                ))}
              </div>
            )}
            <div className="g2" style={{marginBottom:8}}>
              <div style={{background:"#161c2a",borderRadius:6,padding:"8px 10px"}}>
                <div className="lbl">Valeur AVANT</div>
                <div className="mono" style={{fontSize:16}}>{fe(stressImpact.totB)}</div>
              </div>
              <div style={{background:stressImpact.deltaPct>=0?"rgba(46,204,143,.08)":"rgba(232,93,93,.08)",borderRadius:6,padding:"8px 10px",border:"1px solid "+(stressImpact.deltaPct>=0?"rgba(46,204,143,.3)":"rgba(232,93,93,.3)")}}>
                <div className="lbl">Valeur APRÈS</div>
                <div className="mono" style={{fontSize:16,color:stressImpact.deltaPct>=0?"#2ecc8f":"#e85d5d"}}>{fe(stressImpact.totA)}</div>
                <div style={{fontSize:10,color:stressImpact.deltaPct>=0?"#2ecc8f":"#e85d5d"}}>{fp(stressImpact.deltaPct,1)} ({fe(stressImpact.delta)})</div>
              </div>
            </div>
            <div className="lbl" style={{marginBottom:4}}>Top 3 positions exposées</div>
            {stressImpact.top3.map(x=>(
              <div key={x.t} className="row" style={{padding:"6px 0"}}>
                <div style={{flex:"0 0 25%"}} className="tk">{x.t}</div>
                <div style={{flex:1,textAlign:"right",paddingRight:8}} className="dim">{x.s}</div>
                <div style={{flex:"0 0 60px",textAlign:"right",fontWeight:700,color:x.shockPct>=0?"#2ecc8f":"#e85d5d",fontFamily:"monospace"}}>{fp(x.shockPct,0)}</div>
                <div style={{flex:"0 0 70px",textAlign:"right",fontFamily:"monospace",fontSize:11}}>{fe(x.after-x.val)}</div>
              </div>
            ))}
            {!stressResult.dynamic && <div style={{fontSize:9,color:"#3a4560",marginTop:6}}>Données statiques — appuie sur ↻ pour calibrer avec le marché</div>}
          </>
        )}
      </div>
      <div className="warn">
        ℹ️ <strong>Estimation probabiliste, pas une certitude.</strong> Le moteur 10 facteurs combine convictions analyste, momentum, volatilité. Les bandes P10/P50/P90 reflètent l'incertitude — pas un objectif.
      </div>
      <div className="card">
        <div className="cd-ti"><h3>Horizon</h3></div>
        <div className="seg">
          {[3,6,9,12].map(n =>
            <div key={n} className={"it"+(horizon===n?" ac":"")} onClick={()=>setHorizon(n)}>{n}M</div>
          )}
        </div>
      </div>
      <div className="g3">
        <div className="card" style={{textAlign:"center"}}>
          <div className="lbl">P10 (pessimiste)</div>
          <div className="mono" style={{fontSize:18,color:"#e85d5d"}}>{fe(tot10)}</div>
          <div className="num" style={{fontSize:11,color:"#e85d5d"}}>{fp((tot10/m.tot-1)*100,0)}</div>
        </div>
        <div className="card" style={{textAlign:"center"}}>
          <div className="lbl">P50 (médian)</div>
          <div className="mono" style={{fontSize:18,color:"#4f83f5"}}>{fe(tot50)}</div>
          <div className="num" style={{fontSize:11,color:"#4f83f5"}}>{fp((tot50/m.tot-1)*100,0)}</div>
        </div>
        <div className="card" style={{textAlign:"center"}}>
          <div className="lbl">P90 (optimiste)</div>
          <div className="mono" style={{fontSize:18,color:"#2ecc8f"}}>{fe(tot90)}</div>
          <div className="num" style={{fontSize:11,color:"#2ecc8f"}}>{fp((tot90/m.tot-1)*100,0)}</div>
        </div>
      </div>
      <div className="card">
        <div className="cd-ti"><h3>Backtest 3 mois</h3></div>
        {!backtest ? <div className="dim">Calcul...</div> :
         !backtest.available ? <div className="warn">Backtest en cours de constitution. {backtest.ageDays?`Données ${backtest.ageDays}j seulement.`:""} Premier résultat utile dans 3 mois d'utilisation continue.</div> :
         <div>
           <div className="g3">
             <div><div className="lbl">Prédit (P50)</div><div className="num">{fp(backtest.predPct,1)}</div></div>
             <div><div className="lbl">Réel</div><div className="num">{fp(backtest.realPct,1)}</div></div>
             <div><div className="lbl">Écart</div><div className="num" style={{color:cl(-Math.abs(backtest.gap))}}>{fp(backtest.gap,1)}</div></div>
           </div>
         </div>
        }
      </div>
      <div className="card">
        <div className="cd-ti"><h3>Détail par position</h3></div>
        {items.map(x => (
          <div key={x.t} className="row">
            <div className="tk" style={{flex:"0 0 25%"}}>{x.t}</div>
            <div className="num dim" style={{flex:1}}>{fe(x.p10,0)}</div>
            <div className="num" style={{flex:1}}><strong>{fe(x.p50,0)}</strong></div>
            <div className="num dim" style={{flex:1}}>{fe(x.p90,0)}</div>
          </div>
        ))}
      </div>
    </>
  );
}

/* CfgView — DÉCLARÉE HORS de App */
function CfgView({ port, alerts, onPortChange, onAlertsChange, onClearCache, onAskNotif, notifPerm, prices, eurusd, lastTs, fetchCount }) {
  const [editing, setEditing] = useState(null);
  const [form, setForm] = useState({ t:"", n:"", q:"", b:"", s:"Tech", sig:"hold", v:25 });

  const removePos = (t) => {
    if (!confirm(`Supprimer ${t} du portefeuille ?`)) return;
    onPortChange(port.filter(p => p.t !== t));
  };
  const addPos = () => {
    if (!form.t || !form.q || !form.b) { alert("Ticker, quantité et PRU obligatoires"); return; }
    const exists = port.find(p => p.t === form.t.toUpperCase());
    if (exists) { alert("Ticker déjà présent — supprimer puis re-ajouter"); return; }
    onPortChange([...port, { ...form, t: form.t.toUpperCase(), q: +form.q, b: +form.b, v: +form.v }]);
    setForm({ t:"", n:"", q:"", b:"", s:"Tech", sig:"hold", v:25 });
  };

  return (
    <>
      <div className="card">
        <div className="cd-ti"><h3>État système</h3></div>
        <div className="row"><span>Build</span><span className="mono">{BUILD}</span></div>
        <div className="row"><span>EUR/USD live</span><span className="mono">{eurusd ? eurusd.toFixed(4) : "—"}</span></div>
        <div className="row"><span>Prix fetchés</span><span className="mono">{Object.keys(prices).length} / {Object.keys(YF).length}</span></div>
        <div className="row"><span>Dernier refresh</span><span className="mono">{ftime(lastTs)}</span></div>
        <div className="row"><span>Cycles depuis ouverture</span><span className="mono">{fetchCount}</span></div>
        <div className="row"><span>Notifications</span>
          <span style={{color: notifPerm==="granted"?"#2ecc8f":notifPerm==="denied"?"#e85d5d":"#f0a020"}}>
            {notifPerm==="granted"?"✓ activées":notifPerm==="denied"?"✗ refusées":"non demandées"}
          </span>
        </div>
        {notifPerm !== "granted" && notifPerm !== "denied" && (
          <button className="bn bn-b" style={{marginTop:8,width:"100%"}} onClick={onAskNotif}>🔔 Activer les notifications</button>
        )}
      </div>

      <div className="card">
        <div className="cd-ti"><h3>Seuils d'alerte par position</h3></div>
        <div className="dim" style={{fontSize:11,marginBottom:8}}>Auto-rempli intelligent (±vol). Modifiable ci-dessous. Notification à 1h d'intervalle max.</div>
        {port.map(p => {
          const a = alerts[p.t] || { ...smartThresholds(p), on: true };
          const isEd = editing === p.t;
          return (
            <div key={p.t} className="row" style={{flexDirection:"column",alignItems:"stretch",gap:6}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                <div><span className="tk">{p.t}</span> <span className="dim" style={{fontSize:10}}>PRU {fe(p.b)}</span></div>
                <div style={{display:"flex",gap:6,alignItems:"center"}}>
                  <label style={{fontSize:10,display:"flex",alignItems:"center",gap:4}}>
                    <input type="checkbox" checked={a.on!==false} onChange={(e)=>onAlertsChange({...alerts,[p.t]:{...a,on:e.target.checked}})} style={{width:"auto"}}/>
                    actif
                  </label>
                  <button className="bn bn-w ic-only" onClick={()=>setEditing(isEd?null:p.t)}>{isEd?"✓":"✎"}</button>
                </div>
              </div>
              {isEd ? (
                <div className="g2">
                  <div><div className="lbl">Bas (stop)</div>
                    <input type="number" step="0.01" value={a.lo} onChange={(e)=>onAlertsChange({...alerts,[p.t]:{...a,lo:+e.target.value}})}/>
                  </div>
                  <div><div className="lbl">Haut (profit)</div>
                    <input type="number" step="0.01" value={a.hi} onChange={(e)=>onAlertsChange({...alerts,[p.t]:{...a,hi:+e.target.value}})}/>
                  </div>
                </div>
              ) : (
                <div className="dim mono" style={{fontSize:11}}>
                  Bas: {fe(a.lo)} ({fp((a.lo/p.b-1)*100,0)}) — Haut: {fe(a.hi)} ({fp((a.hi/p.b-1)*100,0)})
                </div>
              )}
            </div>
          );
        })}
      </div>

      <div className="card">
        <div className="cd-ti"><h3>Ajouter / Supprimer une position</h3></div>
        <div className="g2" style={{marginBottom:6}}>
          <input placeholder="Ticker (ex: TSLA)" value={form.t} onChange={(e)=>setForm({...form,t:e.target.value})}/>
          <input placeholder="Nom" value={form.n} onChange={(e)=>setForm({...form,n:e.target.value})}/>
        </div>
        <div className="g2" style={{marginBottom:6}}>
          <input placeholder="Quantité" type="number" step="0.000001" value={form.q} onChange={(e)=>setForm({...form,q:e.target.value})}/>
          <input placeholder="PRU EUR" type="number" step="0.01" value={form.b} onChange={(e)=>setForm({...form,b:e.target.value})}/>
        </div>
        <div className="g3" style={{marginBottom:8}}>
          <select value={form.s} onChange={(e)=>setForm({...form,s:e.target.value})}>
            {["Tech","Énergie","Défense","Luxe","Biotech","Matériaux","Autre"].map(s=><option key={s}>{s}</option>)}
          </select>
          <select value={form.sig} onChange={(e)=>setForm({...form,sig:e.target.value})}>
            {["buy","hold","sell","spec"].map(s=><option key={s}>{s}</option>)}
          </select>
          <input placeholder="Vol %" type="number" value={form.v} onChange={(e)=>setForm({...form,v:e.target.value})}/>
        </div>
        <button className="bn bn-g" style={{width:"100%"}} onClick={addPos}>+ Ajouter</button>
        <div style={{marginTop:14,paddingTop:12,borderTop:"1px solid rgba(255,255,255,.06)"}}>
          {port.map(p => (
            <div key={p.t} className="row">
              <span><strong>{p.t}</strong> <span className="dim" style={{fontSize:10}}>{p.n}</span></span>
              <button className="bn bn-r ic-only" onClick={()=>removePos(p.t)}>✕</button>
            </div>
          ))}
        </div>
      </div>

      <div className="card">
        <div className="cd-ti"><h3>Maintenance</h3></div>
        <button className="bn bn-w" style={{width:"100%",marginBottom:6}} onClick={onClearCache}>🗑 Vider le cache prix</button>
        <div className="dim" style={{fontSize:10,textAlign:"center",marginTop:6}}>
          Données stockées localement (localStorage + IndexedDB). Aucun envoi serveur.
        </div>
      </div>
    </>
  );
}

function DetailView({ ticker, port, snapshots, alerts, eurusd, onBack }) {
  const p = port.find(x => x.t === ticker); if (!p) return null;
  const a = AN[ticker] || {};
  const [history, setHistory] = useState(null);

  useEffect(() => {
    snapshotsRange(Date.now() - 90*86400000).then(arr => {
      const series = arr.map(s => {
        const pos = (s.port || []).find(x => x.t === ticker);
        return pos ? { ts: s.ts, date: new Date(s.ts).toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit"}), px: pos.pxE } : null;
      }).filter(Boolean);
      setHistory(series);
    });
  }, [ticker]);

  const f = forecast(p, MACRO);
  const al = alerts[ticker];

  // Données combinées : historique 90j + projection P10/P50/P90 12M
  const chartData = useMemo(() => {
    const last = history && history.length > 0 ? history[history.length-1] : null;
    const base = last?.px || p.pxE || 1;
    const fPts = [1,3,6,12].map(m=>({
      date:`+${m}M`, px:null,
      p10:+(base*(1+f.p10*m/12)).toFixed(4),
      p50:+(base*(1+f.p50*m/12)).toFixed(4),
      p90:+(base*(1+f.p90*m/12)).toFixed(4)
    }));
    if(!history||history.length===0) return base>0?[{date:"Auj.",px:base,p10:base,p50:base,p90:base},...fPts]:[];
    const trans = {...last, p10:base, p50:base, p90:base};
    return [...history.slice(0,-1).map(d=>({...d,p10:null,p50:null,p90:null})), trans, ...fPts];
  }, [history, p.pxE, f.p10, f.p50, f.p90]);

  return (
    <div className="dt-ovr">
      <div className="bk" onClick={onBack}>← Retour</div>
      <div className="card">
        <div className="cd-ti">
          <div>
            <div style={{fontSize:20,fontWeight:800}}>{p.t}</div>
            <div className="dim" style={{fontSize:12}}>{p.n} • {p.s}</div>
          </div>
          <span className={"chip "+p.sig}>{p.sig}</span>
        </div>
        <div className="g2">
          <div><div className="lbl">Cours actuel</div><div className="mono" style={{fontSize:16}}>{fe(p.pxE)}</div></div>
          <div><div className="lbl">PRU</div><div className="mono" style={{fontSize:16}}>{fe(p.b)}</div></div>
          <div><div className="lbl">Quantité</div><div className="mono">{p.q.toLocaleString("fr-FR",{maximumFractionDigits:6})}</div></div>
          <div><div className="lbl">Valeur</div><div className="mono" style={{fontSize:16}}>{fe(p.val)}</div></div>
          <div><div className="lbl">P&amp;L</div><div className="mono" style={{fontSize:16,color:cl(p.pnl)}}>{fe(p.pnl)}</div></div>
          <div><div className="lbl">Performance</div><div className="mono" style={{fontSize:16,color:cl(p.pct)}}>{fp(p.pct)}</div></div>
        </div>
      </div>

      {al && al.on && (
        <div className="card">
          <div className="cd-ti"><h3>Seuils actifs</h3></div>
          <div className="g2">
            <div><div className="lbl">Stop bas</div><div className="mono" style={{color:p.pxE&&p.pxE<=al.lo*1.05?"#e85d5d":"#dde3f0"}}>{fe(al.lo)}</div></div>
            <div><div className="lbl">Profit haut</div><div className="mono" style={{color:p.pxE&&p.pxE>=al.hi*0.95?"#2ecc8f":"#dde3f0"}}>{fe(al.hi)}</div></div>
          </div>
        </div>
      )}

      {chartData.length > 0 && (
        <div className="card">
          <div className="cd-ti"><h3>Cours 90j + prévisions 12M</h3></div>
          <div style={{display:"flex",gap:10,marginBottom:6,flexWrap:"wrap"}}>
            {[["─","#4f83f5","historique"],["╌","#4f83f5","P50 médian"],["╌","#2ecc8f","P90 optimiste"],["╌","#e85d5d","P10 pessimiste"]].map(([sym,col,lbl])=>(
              <span key={lbl} style={{fontSize:9,color:col,display:"flex",alignItems:"center",gap:3}}>
                <span style={{fontFamily:"monospace"}}>{sym}</span>{lbl}
              </span>
            ))}
          </div>
          <div style={{height:220}}>
            <ResponsiveContainer>
              <LineChart data={chartData} margin={{top:5,right:5,left:0,bottom:0}}>
                <CartesianGrid stroke="rgba(255,255,255,.04)" vertical={false}/>
                <XAxis dataKey="date" stroke="#3a4560" fontSize={9} tickLine={false}/>
                <YAxis stroke="#3a4560" fontSize={9} tickLine={false} axisLine={false}
                  tickFormatter={v=>fe(v,0)} width={52}/>
                <Tooltip contentStyle={{background:"#0f1420",border:"1px solid rgba(255,255,255,.1)",borderRadius:6,fontSize:11}}
                  formatter={(v,name)=>v!=null?[fe(v),{px:"Cours",p50:"P50 médian",p90:"P90 optimiste",p10:"P10 pessimiste"}[name]||name]:null}/>
                <ReferenceLine y={p.b} stroke="#8892a8" strokeDasharray="3 3"
                  label={{value:"PRU",fill:"#8892a8",fontSize:8,position:"insideTopLeft"}}/>
                {history&&history.length>0&&<ReferenceLine x={history[history.length-1].date}
                  stroke="rgba(255,255,255,.12)" strokeDasharray="2 4"/>}
                <Line type="monotone" dataKey="px"  stroke="#4f83f5" strokeWidth={2}   dot={false} connectNulls={false}/>
                <Line type="monotone" dataKey="p50" stroke="#4f83f5" strokeWidth={1.5} dot={false} connectNulls={false} strokeDasharray="5 3" strokeOpacity={0.75}/>
                <Line type="monotone" dataKey="p90" stroke="#2ecc8f" strokeWidth={1.5} dot={false} connectNulls={false} strokeDasharray="5 3"/>
                <Line type="monotone" dataKey="p10" stroke="#e85d5d" strokeWidth={1.5} dot={false} connectNulls={false} strokeDasharray="5 3"/>
              </LineChart>
            </ResponsiveContainer>
          </div>
          <div style={{display:"flex",justifyContent:"space-around",fontSize:9,marginTop:4,color:"#8892a8"}}>
            <span>P10 12M : <strong style={{color:"#e85d5d"}}>{fp(f.p10*100,0)}</strong></span>
            <span>P50 12M : <strong style={{color:"#4f83f5"}}>{fp(f.p50*100,0)}</strong></span>
            <span>P90 12M : <strong style={{color:"#2ecc8f"}}>{fp(f.p90*100,0)}</strong></span>
          </div>
        </div>
      )}

      {a.tgt && (
        <div className="card">
          <div className="cd-ti"><h3>Objectifs analystes</h3></div>
          <div className="g3">
            <div><div className="lbl">Bas</div><div className="mono">{fd(a.tgt.l)}</div></div>
            <div><div className="lbl">Médian</div><div className="mono"><strong>{fd(a.tgt.a)}</strong></div></div>
            <div><div className="lbl">Haut</div><div className="mono">{fd(a.tgt.h)}</div></div>
          </div>
        </div>
      )}

      {a.th && (
        <div className="card">
          <div className="cd-ti"><h3>Thèse</h3><span className={"chip "+a.sig}>{a.r}</span></div>
          <div style={{lineHeight:1.55}}>{a.th}</div>
          {a.edg && <div className="warn" style={{marginTop:10}}><strong>Edge :</strong> {a.edg}</div>}
        </div>
      )}

      {a.cat && (
        <div className="g2">
          <div className="card">
            <div className="cd-ti"><h3 style={{color:"#2ecc8f"}}>Catalyseurs</h3></div>
            {a.cat.map((c,i)=><div key={i} className="row" style={{padding:"6px 0"}}>{c}</div>)}
          </div>
          <div className="card">
            <div className="cd-ti"><h3 style={{color:"#e85d5d"}}>Risques</h3></div>
            {a.ris.map((r,i)=><div key={i} className="row" style={{padding:"6px 0"}}>{r}</div>)}
          </div>
        </div>
      )}

      <div className="card">
        <div className="cd-ti"><h3>Prévision (10 facteurs)</h3></div>
        <div className="g3">
          <div><div className="lbl">P10 12M</div><div className="mono" style={{color:"#e85d5d"}}>{fp(f.p10*100,0)}</div></div>
          <div><div className="lbl">P50 12M</div><div className="mono"><strong>{fp(f.p50*100,0)}</strong></div></div>
          <div><div className="lbl">P90 12M</div><div className="mono" style={{color:"#2ecc8f"}}>{fp(f.p90*100,0)}</div></div>
        </div>
        <div className="dim" style={{fontSize:10,marginTop:8,fontStyle:"italic"}}>Estimation probabiliste, pas une certitude.</div>
      </div>

      {a.act && (
        <div className="card" style={{background:"rgba(79,131,245,.08)",borderColor:"rgba(79,131,245,.3)"}}>
          <div className="cd-ti"><h3 style={{color:"#4f83f5"}}>Action recommandée</h3></div>
          <div style={{fontSize:14,fontWeight:600}}>{a.act}</div>
        </div>
      )}
    </div>
  );
}

/* ============== APP PRINCIPALE ============== */
function App() {
  const [port, setPort] = useState(() => {
    const s = loadStore(); return s?.port || PORT_DEF;
  });
  const [prices, setPrices] = useState(() => {
    const stored = loadStore()?.prices || {};
    // PRICE_DEF en fallback pour combler les éventuels trous → jamais "—" au boot
    return { ...PRICE_DEF, ...stored };
  });
  const [eurusd, setEurusd] = useState(() => loadStore()?.eurusd || FALLBACK_EURUSD);
  const [lastTs, setLastTs] = useState(() => loadStore()?.priceTs || 0);
  const [status, setStatus] = useState("ld");
  const [tab, setTab] = useState("pos");
  const [detail, setDetail] = useState(null);
  const [toast, setToast] = useState(null);
  const [alerts, setAlerts] = useState(loadAlerts);
  const [snapshots, setSnapshots] = useState([]);
  const [countdown, setCountdown] = useState(1);
  const [fetchCount, setFetchCount] = useState(0);
  const [notifPerm, setNotifPerm] = useState(typeof Notification !== "undefined" ? Notification.permission : "default");

  const busyRef = useRef(false);
  const portRef = useRef(port); useEffect(() => { portRef.current = port; }, [port]);
  const timerRef = useRef(null);
  const cdRef = useRef(null);
  const lastNotifRef = useRef({});

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  }, []);

  // Auto-init alertes pour positions sans seuils
  useEffect(() => {
    let changed = false;
    const next = { ...alerts };
    port.forEach(p => {
      if (!next[p.t]) {
        next[p.t] = { ...smartThresholds(p), on: true };
        changed = true;
      }
    });
    if (changed) { setAlerts(next); saveAlerts(next); }
  }, [port]);

  // Charger snapshots
  const reloadSnapshots = useCallback(async () => {
    const s = await snapshotsRange(0);
    setSnapshots(s.sort((a,b)=>a.ts-b.ts));
  }, []);
  useEffect(() => { reloadSnapshots(); }, [reloadSnapshots]);

  // Fetch principal
  const fetchAll = useCallback(async (silent) => {
    if (busyRef.current) return;
    busyRef.current = true;
    if (!silent) setStatus("ld");
    try {
      const { prices: np, eurusd: ne } = await fetchAllPrices();
      setPrices(prev => ({ ...prev, ...np }));
      setEurusd(ne);
      const now = Date.now();
      setLastTs(now);
      setStatus("");
      setFetchCount(c => c + 1);

      // Sauvegarde locale
      const enriched = enrich(portRef.current, np, ne);
      const m = metrics(enriched);
      saveStore({ port: portRef.current, prices: np, eurusd: ne, priceTs: now });

      // Snapshot historique (max 1 par 5min)
      const last = snapshots[snapshots.length-1];
      if (!last || now - last.ts > 5*60*1000) {
        const snap = {
          ts: now,
          date: new Date(now).toISOString().slice(0,10),
          tot: m.tot, inv: m.inv, pnl: m.pnl,
          eurusd: ne,
          port: enriched.map(p => ({ t:p.t, q:p.q, b:p.b, pxE:p.pxE, val:p.val })),
          pred3M: enriched.reduce((s,p) => {
            if (!p.val) return s;
            const f = forecast(p, MACRO);
            return s + p.val * (1 + f.p50 * 0.25);
          }, 0) / Math.max(1, m.tot) * 100 - 100
        };
        await snapshotAdd(snap);
        reloadSnapshots();
      }

      // Vérification alertes
      checkAlerts(enriched, alerts, np, ne, lastNotifRef.current);

      if (!silent && Object.keys(np).length > 0) showToast("✓ Cours actualisés");
    } catch(e) {
      console.error("[Fetch] global err", e);
      setStatus("er");
      if (!silent) showToast("✗ Erreur de récupération");
    } finally {
      busyRef.current = false;
    }
  }, [alerts, snapshots, showToast, reloadSnapshots]);

  // Boot + interval
  useEffect(() => {
    fetchAll(true);
    timerRef.current = setInterval(() => fetchAll(true), REFRESH_MS);
    cdRef.current = setInterval(() => {
      setCountdown(c => {
        const elapsed = (Date.now() - (lastTs||Date.now())) / REFRESH_MS;
        return Math.max(0, 1 - elapsed);
      });
    }, 200);
    return () => { clearInterval(timerRef.current); clearInterval(cdRef.current); };
  // eslint-disable-next-line
  }, []);

  // Sync au retour de visibilité
  useEffect(() => {
    const onVis = () => { if (!document.hidden) fetchAll(false); };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, [fetchAll]);

  // Persistance portfolio
  useEffect(() => {
    saveStore({ port, prices, eurusd, priceTs: lastTs });
  }, [port]);

  // Persistance alertes
  useEffect(() => { saveAlerts(alerts); }, [alerts]);

  // Données dérivées
  const enriched = useMemo(() => enrich(port, prices, eurusd), [port, prices, eurusd]);
  const m = useMemo(() => metrics(enriched), [enriched]);
  const sells = enriched.filter(p => p.sig === "sell").length;

  // Update countdown depuis lastTs
  useEffect(() => {
    setCountdown(1);
  }, [lastTs]);

  // Détail
  const detailPort = detail ? enriched.find(p => p.t === detail) : null;

  return (
    <div className="app">
      <Header
        countdownPct={countdown}
        status={status}
        lastTs={lastTs}
        onPillClick={() => fetchAll(false)}
      />

      <Strip m={m} alertCount={sells}/>

      {tab === "pos" && <PositionsView port={enriched} m={m} eurusd={eurusd} onSelect={setDetail} onTabChange={setTab}/>}
      {tab === "his" && <HistoryView snapshots={snapshots} port={enriched}/>}
      {tab === "macro" && <MacroView/>}
      {tab === "adv" && <AdvisorView port={enriched} m={m} onSelect={setDetail}/>}
      {tab === "anal" && <AnalysisView port={enriched} onSelect={setDetail}/>}
      {tab === "scen" && <ScenariosView port={enriched} m={m}/>}
      {tab === "cfg" && <CfgView
        port={port} alerts={alerts}
        onPortChange={setPort}
        onAlertsChange={setAlerts}
        onClearCache={() => { setPrices({}); showToast("Cache vidé"); fetchAll(false); }}
        onAskNotif={async () => {
          const ok = await askNotifPerm();
          setNotifPerm(Notification.permission);
          showToast(ok ? "✓ Notifications activées" : "✗ Notifications refusées");
        }}
        notifPerm={notifPerm}
        prices={prices}
        eurusd={eurusd}
        lastTs={lastTs}
        fetchCount={fetchCount}
      />}

      {detail && detailPort && <DetailView
        ticker={detail} port={enriched} snapshots={snapshots}
        alerts={alerts} eurusd={eurusd} onBack={() => setDetail(null)}
      />}

      {toast && <div className="toast">{toast}</div>}

      <nav className="tab">
        {[
          {k:"pos",ic:"💼",l:"Positions"},
          {k:"his",ic:"📈",l:"Historique"},
          {k:"macro",ic:"🌍",l:"Macro"},
          {k:"adv",ic:"🏦",l:"Conseil"},
          {k:"anal",ic:"🔍",l:"Analyse"},
          {k:"scen",ic:"🎯",l:"Scénar."},
          {k:"cfg",ic:"⚙️",l:"Régl."}
        ].map(t => (
          <div key={t.k} className={"tb"+(tab===t.k?" ac":"")} onClick={() => { setTab(t.k); setDetail(null); }}>
            <div className="ic">{t.ic}</div>
            <div>{t.l}</div>
          </div>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
