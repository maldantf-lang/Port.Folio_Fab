/* ============== INDEXEDDB (historique) ============== */
function openDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(SNAP_STORE)) {
        const s = db.createObjectStore(SNAP_STORE, { keyPath: "ts" });
        s.createIndex("date", "date", { unique: false });
      }
    };
    req.onsuccess = () => res(req.result);
    req.onerror = () => rej(req.error);
  });
}
async function snapshotAdd(snap) {
  try {
    const db = await openDB();
    return new Promise((res, rej) => {
      const tx = db.transaction(SNAP_STORE, "readwrite");
      tx.objectStore(SNAP_STORE).put(snap);
      tx.oncomplete = () => { db.close(); res(); };
      tx.onerror = () => { db.close(); rej(tx.error); };
    });
  } catch(e) { console.warn("[DB] add err", e); }
}
async function snapshotsRange(fromTs) {
  try {
    const db = await openDB();
    return new Promise((res) => {
      const tx = db.transaction(SNAP_STORE, "readonly");
      const out = [];
      const req = tx.objectStore(SNAP_STORE).openCursor();
      req.onsuccess = (e) => {
        const c = e.target.result;
        if (c) { if (c.value.ts >= fromTs) out.push(c.value); c.continue(); }
        else { db.close(); res(out); }
      };
      req.onerror = () => { db.close(); res([]); };
    });
  } catch(e) { return []; }
}

async function fetchOne(url, isWrap) {
  const ctrl = new AbortController();
  const to = setTimeout(() => ctrl.abort(), 9000);
  try {
    const r = await fetch(url, { signal: ctrl.signal });
    clearTimeout(to);
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    const data = isWrap ? JSON.parse(j.contents) : j;
    const px = data?.chart?.result?.[0]?.meta?.regularMarketPrice;
    if (!isFinite(px) || px <= 0) throw new Error("invalid price");
    return px;
  } catch(e) { clearTimeout(to); throw e; }
}

async function fetchSymbol(sym) {
  const promises = PROXIES.map((mk, i) => fetchOne(mk(sym), i === 5));
  return Promise.any(promises);
}

async function fetchAllPrices() {
  const tickers = Object.keys(YF);
  const results = {};
  await Promise.all(tickers.map(async t => {
    try { results[t] = await fetchSymbol(YF[t].y); }
    catch(e) { console.warn("[Fetch]", t, "→", YF[t].y, "fail"); }
  }));
  let eurusd = FALLBACK_EURUSD;
  try {
    const r = await fetchSymbol("EURUSD=X");
    if (r > 0.5 && r < 2) eurusd = r;
  } catch(e) { console.warn("[Fetch] EURUSD fail, fallback", FALLBACK_EURUSD); }
  return { prices: results, eurusd };
}

/* ============== CALCULS ============== */
function priceEUR(t, prices, eurusd) {
  const meta = YF[t]; const px = prices[t];
  if (px == null || !meta) return null;
  return meta.ccy === "EUR" ? px : px / eurusd;
}
function enrich(port, prices, eurusd) {
  const items = port.map(p => {
    const inv = p.q * p.b;
    const pxE = priceEUR(p.t, prices, eurusd);
    const val = pxE != null ? p.q * pxE : null;
    const pnl = val != null ? val - inv : null;
    const pct = (val != null && inv > 0) ? (pnl / inv) * 100 : null;
    return { ...p, inv, pxE, val, pnl, pct };
  });
  const tot = items.reduce((s,p) => s + (p.val || 0), 0);
  return items.map(p => ({ ...p, wt: tot > 0 && p.val ? (p.val/tot)*100 : 0 }));
}
function metrics(port) {
  let tot=0, inv=0, pnl=0, wv2=0, wp=0, miss=0;
  port.forEach(p => {
    inv += p.inv;
    if (p.val == null) { miss++; return; }
    tot += p.val; pnl += p.pnl;
    wv2 += Math.pow((p.v||20) * p.wt/100, 2);
    wp  += (p.pct||0) * p.wt / 100;
  });
  const wv = Math.sqrt(wv2) * Math.sqrt(1.5);
  return { tot, inv, pnl, wv, wp, sh: wv > 0 ? (wp - 3.5) / wv : 0, miss };
}

const fd = (v, d=2) => { if (v == null || !isFinite(v)) return "—"; return (v<0?"-":"") + "$" + Math.abs(v).toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}); };
const fp = (v, d=1) => { if (v == null || !isFinite(v)) return "—"; return (v>=0?"+":"-") + Math.abs(v).toFixed(d) + "%"; };
const fnum = (v, d=2) => { if (v == null || !isFinite(v)) return "—"; return v.toLocaleString("fr-FR",{minimumFractionDigits:d,maximumFractionDigits:d}); };

async function askNotifPerm() {
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  if (Notification.permission === "denied") return false;
  try { const r = await Notification.requestPermission(); return r === "granted"; }
  catch(e) { return false; }
}
function notify(title, body) {
  if (!("Notification" in window) || Notification.permission !== "granted") return;
  try { new Notification(title, { body, icon: "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23080b11'/%3E%3Ctext x='50' y='62' font-size='52' text-anchor='middle' font-weight='800' fill='%23dde3f0'%3Ep%3Ctspan fill='%234f83f5'%3E.%3C/tspan%3Ef%3C/text%3E%3C/svg%3E" }); }

}

/* ============== ALERTES SEUILS ============== */
function smartThresholds(pos, pxE) {
  // Calcul intelligent des seuils par défaut basés sur PRU et volatilité
  const v = pos.v || 25;
  const lo = +(pos.b * (1 - Math.min(0.20, v/100 * 0.5))).toFixed(2);
  const hi = +(pos.b * (1 + Math.min(0.40, v/100 * 1.0))).toFixed(2);
  return { lo, hi };
}
function checkAlerts(port, alerts, prices, eurusd, lastNotifRef) {
  const now = Date.now();
  port.forEach(p => {
    const pxE = priceEUR(p.t, prices, eurusd);
    if (pxE == null) return;
    const a = alerts[p.t]; if (!a || !a.on) return;
    const lastT = lastNotifRef[p.t] || 0;
    if (now - lastT < 3600000) return; // 1h cooldown par ticker
    if (a.hi && pxE >= a.hi) {
      notify(`🎯 ${p.t} a atteint le seuil HAUT`, `${pxE.toFixed(2)}€ ≥ ${a.hi}€ — prise de profit`);
      lastNotifRef[p.t] = now;
    } else if (a.lo && pxE <= a.lo) {
      notify(`⚠️ ${p.t} sous le seuil BAS`, `${pxE.toFixed(2)}€ ≤ ${a.lo}€ — stop-loss`);
      lastNotifRef[p.t] = now;
    }
  });
}

/* ============== MOTEUR PRÉVISION 10 FACTEURS ============== */
function forecast(pos, mac) {
  const an = AN[pos.t] || {};
  // 10 facteurs (compactés) : conviction, momentum sectoriel, signal, volatilité, position cycle, etc.
  const f1 = (an.c || 50) / 100;          // conviction analyste
  const f2 = an.sig === "buy" ? 1 : an.sig === "sell" ? -1 : an.sig === "spec" ? .3 : 0;
  const f3 = (an.p || 0) / 100;           // proj 12M brute
  const f4 = pos.sig === "buy" ? .6 : pos.sig === "sell" ? -.4 : 0;
  const f5 = (pos.v || 25) / 100;         // volatilité
  const f6 = pos.pct != null ? Math.tanh(pos.pct/100) : 0; // momentum perso
  const f7 = ["IA","Tech","Défense","Énergie"].includes(pos.s) ? .15 : 0; // tailwind sectoriel
  const f8 = pos.s === "Énergie" && pos.sig === "sell" ? -.10 : 0;
  const f9 = mac && mac.regime?.includes("stagflation") ? -.05 : 0;
  const f10 = an.tgt ? (an.tgt.a / Math.max(0.01, pos.b) - 1) * 0.3 : 0;
  const mu12 = f3*0.5 + f2*0.06 + f4*0.04 + f6*0.08 + f7 + f8 + f9 + f10*0.4;
  const sigma12 = Math.max(0.10, f5 * 1.2);
  // P10/P50/P90
  return {
    p10: mu12 - 1.28 * sigma12,
    p50: mu12,
    p90: mu12 + 1.28 * sigma12,
    sigma: sigma12,
    factors: { f1,f2,f3,f4,f5,f6,f7,f8,f9,f10 }
  };
}

  const h = horizon / 12;

  const [backtest, setBacktest] = useState(null);
  useEffect(() => {
    snapshotsRange(Date.now() - 100*86400000).then(arr => {
      if (arr.length === 0) { setBacktest({ available:false }); return; }
      const target = Date.now() - 90*86400000;
      const closest = arr.reduce((a,b) => Math.abs(b.ts-target)<Math.abs(a.ts-target)?b:a);
      const ageDays = Math.round((Date.now() - closest.ts)/86400000);
      if (ageDays < 60) { setBacktest({ available:false, ageDays }); return; }
      const realPct = closest.tot > 0 ? ((m.tot - closest.tot)/closest.tot)*100 : 0;
      const predPct = (closest.pred3M || 0);
      setBacktest({ available:true, ageDays, realPct, predPct, gap: realPct - predPct });
    });
  }, [m.tot]);

  const items = port.map(p => {
    if (p.val == null) return null;
    const f = forecast(p, MACRO);
    return {
      t: p.t,
      val: p.val,
      p10: p.val * (1 + f.p10 * h),
      p50: p.val * (1 + f.p50 * h),
      p90: p.val * (1 + f.p90 * h)
    };
  }).filter(Boolean);
  const tot10 = items.reduce((s,x)=>s+x.p10,0);
  const tot50 = items.reduce((s,x)=>s+x.p50,0);
  const tot90 = items.reduce((s,x)=>s+x.p90,0);

  return (
    <>
      <div className="warn">
        ℹ️ <strong>Estimation probabiliste, pas une certitude.</strong> Le moteur 10 facteurs combine convictions analyste, momentum, volatilité. Les bandes P10/P50/P90 reflètent l'incertitude — pas un objectif.
      </div>
      <div className="card">
        <div className="cd-ti"><h3>Horizon</h3></div>
        <div className="seg">
          {[3,6,9,12].map(n =>
            <div key={n} className={"it"+(horizon===n?" ac":"")} onClick={()=>setHorizon(n)}>{n}M</div>
          )}
        </div>
      </div>
      <div className="g3">
        <div className="card" style={{textAlign:"center"}}>
          <div className="lbl">P10 (pessimiste)</div>
          <div className="mono" style={{fontSize:18,color:"#e85d5d"}}>{fe(tot10)}</div>
          <div className="num" style={{fontSize:11,color:"#e85d5d"}}>{fp((tot10/m.tot-1)*100,0)}</div>
        </div>
        <div className="card" style={{textAlign:"center"}}>
          <div className="lbl">P50 (médian)</div>
          <div className="mono" style={{fontSize:18,color:"#4f83f5"}}>{fe(tot50)}</div>
          <div className="num" style={{fontSize:11,color:"#4f83f5"}}>{fp((tot50/m.tot-1)*100,0)}</div>
        </div>
        <div className="card" style={{textAlign:"center"}}>
          <div className="lbl">P90 (optimiste)</div>
          <div className="mono" style={{fontSize:18,color:"#2ecc8f"}}>{fe(tot90)}</div>
          <div className="num" style={{fontSize:11,color:"#2ecc8f"}}>{fp((tot90/m.tot-1)*100,0)}</div>
        </div>
      </div>
      <div className="card">
        <div className="cd-ti"><h3>Backtest 3 mois</h3></div>
        {!backtest ? <div className="dim">Calcul...</div> :
         !backtest.available ? <div className="warn">Backtest en cours de constitution. {backtest.ageDays?`Données ${backtest.ageDays}j seulement.`:""} Premier résultat utile dans 3 mois d'utilisation continue.</div> :
         <div>
           <div className="g3">
             <div><div className="lbl">Prédit (P50)</div><div className="num">{fp(backtest.predPct,1)}</div></div>
             <div><div className="lbl">Réel</div><div className="num">{fp(backtest.realPct,1)}</div></div>
             <div><div className="lbl">Écart</div><div className="num" style={{color:cl(-Math.abs(backtest.gap))}}>{fp(backtest.gap,1)}</div></div>
           </div>
         </div>
        }
      </div>
      <div className="card">
        <div className="cd-ti"><h3>Détail par position</h3></div>
        {items.map(x => (
          <div key={x.t} className="row">
            <div className="tk" style={{flex:"0 0 25%"}}>{x.t}</div>
            <div className="num dim" style={{flex:1}}>{fe(x.p10,0)}</div>
            <div className="num" style={{flex:1}}><strong>{fe(x.p50,0)}</strong></div>
            <div className="num dim" style={{flex:1}}>{fe(x.p90,0)}</div>
          </div>
        ))}
      </div>
    </>
  );
}

/* ============== APP PRINCIPALE ============== */
function App() {
  const [port, setPort] = useState(() => {
    const s = loadStore(); return s?.port || PORT_DEF;
  });
  const [prices, setPrices] = useState(() => loadStore()?.prices || {});
  const [eurusd, setEurusd] = useState(() => loadStore()?.eurusd || FALLBACK_EURUSD);
  const [lastTs, setLastTs] = useState(() => loadStore()?.priceTs || 0);
  const [status, setStatus] = useState("ld");
  const [tab, setTab] = useState("pos");
  const [detail, setDetail] = useState(null);
  const [toast, setToast] = useState(null);
  const [alerts, setAlerts] = useState(loadAlerts);
  const [snapshots, setSnapshots] = useState([]);
  const [countdown, setCountdown] = useState(1);
  const [fetchCount, setFetchCount] = useState(0);
  const [notifPerm, setNotifPerm] = useState(typeof Notification !== "undefined" ? Notification.permission : "default");

  const busyRef = useRef(false);
  const portRef = useRef(port); useEffect(() => { portRef.current = port; }, [port]);
  const timerRef = useRef(null);
  const cdRef = useRef(null);
  const lastNotifRef = useRef({});

  const showToast = useCallback((msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2500);
  }, []);

  // Auto-init alertes pour positions sans seuils
  useEffect(() => {
    let changed = false;
    const next = { ...alerts };
    port.forEach(p => {
      if (!next[p.t]) {
        next[p.t] = { ...smartThresholds(p), on: true };
        changed = true;
      }
    });
    if (changed) { setAlerts(next); saveAlerts(next); }
  }, [port]);

  // Charger snapshots
  const reloadSnapshots = useCallback(async () => {
    const s = await snapshotsRange(0);
    setSnapshots(s.sort((a,b)=>a.ts-b.ts));
  }, []);
  useEffect(() => { reloadSnapshots(); }, [reloadSnapshots]);

  // Fetch principal
  const fetchAll = useCallback(async (silent) => {
    if (busyRef.current) return;
    busyRef.current = true;
    if (!silent) setStatus("ld");
    try {
      const { prices: np, eurusd: ne } = await fetchAllPrices();
      setPrices(prev => ({ ...prev, ...np }));
      setEurusd(ne);
      const now = Date.now();
      setLastTs(now);
      setStatus("");
      setFetchCount(c => c + 1);

      // Sauvegarde locale
      const enriched = enrich(portRef.current, np, ne);
      const m = metrics(enriched);
      saveStore({ port: portRef.current, prices: np, eurusd: ne, priceTs: now });

      // Snapshot historique (max 1 par 5min)
      const last = snapshots[snapshots.length-1];
      if (!last || now - last.ts > 5*60*1000) {
        const snap = {
          ts: now,
          date: new Date(now).toISOString().slice(0,10),
          tot: m.tot, inv: m.inv, pnl: m.pnl,
          eurusd: ne,
          port: enriched.map(p => ({ t:p.t, q:p.q, b:p.b, pxE:p.pxE, val:p.val })),
          pred3M: enriched.reduce((s,p) => {
            if (!p.val) return s;
            const f = forecast(p, MACRO);
            return s + p.val * (1 + f.p50 * 0.25);
          }, 0) / Math.max(1, m.tot) * 100 - 100
        };
        await snapshotAdd(snap);
        reloadSnapshots();
      }

      // Vérification alertes
      checkAlerts(enriched, alerts, np, ne, lastNotifRef.current);

      if (!silent && Object.keys(np).length > 0) showToast("✓ Cours actualisés");
    } catch(e) {
      console.error("[Fetch] global err", e);
      setStatus("er");
      if (!silent) showToast("✗ Erreur de récupération");
    } finally {
      busyRef.current = false;
    }
  }, [alerts, snapshots, showToast, reloadSnapshots]);

  // Boot + interval
  useEffect(() => {
    fetchAll(true);
    timerRef.current = setInterval(() => fetchAll(true), REFRESH_MS);
    cdRef.current = setInterval(() => {
      setCountdown(c => {
        const elapsed = (Date.now() - (lastTs||Date.now())) / REFRESH_MS;
        return Math.max(0, 1 - elapsed);
      });
    }, 200);
    return () => { clearInterval(timerRef.current); clearInterval(cdRef.current); };
  // eslint-disable-next-line
  }, []);

  // Sync au retour de visibilité
  useEffect(() => {
    const onVis = () => { if (!document.hidden) fetchAll(false); };
    document.addEventListener("visibilitychange", onVis);
    return () => document.removeEventListener("visibilitychange", onVis);
  }, [fetchAll]);

  // Persistance portfolio
  useEffect(() => {
    saveStore({ port, prices, eurusd, priceTs: lastTs });
  }, [port]);

  // Persistance alertes
  useEffect(() => { saveAlerts(alerts); }, [alerts]);

  // Données dérivées
  const enriched = useMemo(() => enrich(port, prices, eurusd), [port, prices, eurusd]);
  const m = useMemo(() => metrics(enriched), [enriched]);
  const sells = enriched.filter(p => p.sig === "sell").length;

  // Update countdown depuis lastTs
  useEffect(() => {
    setCountdown(1);
  }, [lastTs]);

  // Détail
  const detailPort = detail ? enriched.find(p => p.t === detail) : null;

  return (
    <div className="app">
      <Header
        countdownPct={countdown}
        status={status}
        lastTs={lastTs}
        onPillClick={() => fetchAll(false)}
      />

      <Strip m={m} alertCount={sells}/>

      {tab === "pos" && <PositionsView port={enriched} m={m} eurusd={eurusd} onSelect={setDetail} onTabChange={setTab}/>}
      {tab === "his" && <HistoryView snapshots={snapshots} port={enriched}/>}
      {tab === "macro" && <MacroView/>}
      {tab === "adv" && <AdvisorView port={enriched} m={m} onSelect={setDetail}/>}
      {tab === "anal" && <AnalysisView port={enriched} onSelect={setDetail}/>}
      {tab === "scen" && <ScenariosView port={enriched} m={m}/>}
      {tab === "cfg" && <CfgView
        port={port} alerts={alerts}
        onPortChange={setPort}
        onAlertsChange={setAlerts}
        onClearCache={() => { setPrices({}); showToast("Cache vidé"); fetchAll(false); }}
        onAskNotif={async () => {
          const ok = await askNotifPerm();
          setNotifPerm(Notification.permission);
          showToast(ok ? "✓ Notifications activées" : "✗ Notifications refusées");
        }}
        notifPerm={notifPerm}
        prices={prices}
        eurusd={eurusd}
        lastTs={lastTs}
        fetchCount={fetchCount}
      />}

      {detail && detailPort && <DetailView
        ticker={detail} port={enriched} snapshots={snapshots}
        alerts={alerts} eurusd={eurusd} onBack={() => setDetail(null)}
      />}

      {toast && <div className="toast">{toast}</div>}

      <nav className="tab">
        {[
          {k:"pos",ic:"💼",l:"Positions"},
          {k:"his",ic:"📈",l:"Historique"},
          {k:"macro",ic:"🌍",l:"Macro"},
          {k:"adv",ic:"🏦",l:"Conseil"},
          {k:"anal",ic:"🔍",l:"Analyse"},
          {k:"scen",ic:"🎯",l:"Scénar."},
          {k:"cfg",ic:"⚙️",l:"Régl."}
        ].map(t => (
          <div key={t.k} className={"tb"+(tab===t.k?" ac":"")} onClick={() => { setTab(t.k); setDetail(null); }}>
            <div className="ic">{t.ic}</div>
            <div>{t.l}</div>
          </div>
        ))}
      </nav>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
</script>
</body>
</html>
